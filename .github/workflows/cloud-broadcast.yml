name: OnAir 24x7 Cloud Broadcast Engine

on:
  workflow_dispatch:
    inputs:
      feed_url:
        description: 'Program Output Feed URL'
        required: false
        default: 'https://24.onairplayout.com/?view=program&uid=op_1790161020557&overlay_only=1'
      rtmp_url:
        description: 'RTMP Destination URL(s) (pipe-separated for multiple)'
        required: false
        default: 'rtmp://rtmp.onairplayout.com:1935/live/live_nadeem'
      duration_sec:
        description: 'Stream duration in seconds (default 20700 = 5h45m)'
        required: false
        default: '20700'

jobs:
  broadcast:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      TZ: Asia/Karachi
    steps:
      - name: Checkout Engine
        uses: actions/checkout@v4

      - name: Configure Timezone, FFmpeg, Xvfb, Urdu Fonts & yt-dlp (Fast Setup)
        run: |
          set +e
          sudo ln -snf /usr/share/zoneinfo/Asia/Karachi /etc/localtime && echo "Asia/Karachi" | sudo tee /etc/timezone
          if ! command -v ffmpeg >/dev/null 2>&1 || ! command -v Xvfb >/dev/null 2>&1 || ! command -v pactl >/dev/null 2>&1; then
            sudo DEBIAN_FRONTEND=noninteractive apt-get update -qq || true
            sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends ffmpeg xvfb xauth ca-certificates pulseaudio pulseaudio-utils || true
          fi
          mkdir -p ~/.local/share/fonts
          curl -sL "https://github.com/google/fonts/raw/main/ofl/amiri/Amiri-Bold.ttf" -o ~/.local/share/fonts/Amiri-Bold.ttf || true
          curl -sL "https://github.com/google/fonts/raw/main/ofl/notonastaliqurdu/NotoNastaliqUrdu%5Bwght%5D.ttf" -o ~/.local/share/fonts/NotoNastaliqUrdu.ttf || true
          fc-cache -f ~/.local/share/fonts || true
          sudo curl -sL https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp -o /usr/local/bin/yt-dlp && sudo chmod a+rx /usr/local/bin/yt-dlp || true

      - name: Launch 24/7 Headless Broadcast Studio (Local NVMe SSD + YouTube Bot-Bypass + Dynamic Encoder Settings)
        env:
          TZ: Asia/Karachi
          FEED_URL: ${{ inputs.feed_url || 'https://24.onairplayout.com/?view=program&uid=op_1790161020557&overlay_only=1' }}
          RTMP_URL: ${{ inputs.rtmp_url || 'rtmp://rtmp.onairplayout.com:1935/live/live_nadeem' }}
          DURATION_SEC: ${{ inputs.duration_sec || '20700' }}
        run: |
          set +e
          export TZ=Asia/Karachi
          export PATH="$HOME/.local/bin:/usr/local/bin:$PATH"
          if ! echo "$FEED_URL" | grep -q "overlay_only=1"; then
            FEED_URL="${FEED_URL}&overlay_only=1"
          fi

          mkdir -p /tmp/media_cache
          CB_TS=$(date +%s)
          # Pre-cache active uploads to local NVMe SSD using .tmp + cache-buster so Cloudflare Edge never serves stale cached files
          (curl -sL "https://24.onairplayout.com/uploads/BAHAAR_-The_Spirit_Of_Kashmir__Cover__By_Adnan_Manzoor_-_Qalaam_Studio.mp4?_v=${CB_TS}" -o "/tmp/media_cache/bahaar.tmp" && mv "/tmp/media_cache/bahaar.tmp" "/tmp/media_cache/BAHAAR_-The_Spirit_Of_Kashmir__Cover__By_Adnan_Manzoor_-_Qalaam_Studio.mp4") &
          (curl -sL "https://24.onairplayout.com/uploads/USP_MULTAN_15_Anniversary.mp4?_v=${CB_TS}" -o "/tmp/media_cache/usp.tmp" && mv "/tmp/media_cache/usp.tmp" "/tmp/media_cache/USP_MULTAN_15_Anniversary.mp4") &
          (curl -sL "https://24.onairplayout.com/uploads/yt_cAd8cvqRi9g.mp4?_v=${CB_TS}" -o "/tmp/media_cache/yt1.tmp" && mv "/tmp/media_cache/yt1.tmp" "/tmp/media_cache/yt_cAd8cvqRi9g.mp4") &
          (curl -sL "https://24.onairplayout.com/uploads/yt_P4zyZAl30To.mp4?_v=${CB_TS}" -o "/tmp/media_cache/yt2.tmp" && mv "/tmp/media_cache/yt2.tmp" "/tmp/media_cache/yt_P4zyZAl30To.mp4") &
          DEFAULT_HF_VIDEO="https://24.onairplayout.com/uploads/Elite_Force_2026_S01E01_720p_HD.mp4?_v=${CB_TS}"
          (
            curl -sL "$DEFAULT_HF_VIDEO" -o "/tmp/media_cache/elite_force.mp4.tmp" && mv "/tmp/media_cache/elite_force.mp4.tmp" "/tmp/media_cache/Elite_Force_2026_S01E01_720p_HD.mp4"
          ) &

          # 1. Start PulseAudio virtual speaker
          pulseaudio -D --exit-idle-time=-1 || true
          pactl load-module module-null-sink sink_name=virtual_speaker sink_properties=device.description="Virtual_Speaker" || true
          pactl set-default-sink virtual_speaker || true

          # 2. Start Xvfb 1280x720 24-bit Virtual Screen
          Xvfb :99 -screen 0 1280x720x24 -ac +extension GLX +render -noreset &
          export DISPLAY=:99
          sleep 2

          # 3. Launch Google Chrome in Fullscreen App Mode for Live Tickers + Flares + Logo + Clock
          mkdir -p /tmp/chrome-prof
          touch "/tmp/chrome-prof/First Run"
          TZ=Asia/Karachi google-chrome \
            --no-sandbox \
            --no-first-run \
            --no-default-browser-check \
            --disable-search-engine-choice-screen \
            --user-data-dir=/tmp/chrome-prof \
            --disable-gpu \
            --autoplay-policy=no-user-gesture-required \
            --window-size=1280,720 \
            --window-position=0,0 \
            --kiosk \
            --hide-scrollbars \
            --disable-infobars \
            --disable-notifications \
            --app="$FEED_URL" &

          echo "Waiting 5 seconds for Output Feed & Urdu Tickers to render in Pakistan Time (Asia/Karachi)..."
          sleep 5

          # 4. Create Persistent Headerless Raw Video + Audio FIFOs (/tmp/vid_pipe.yuv & /tmp/aud_pipe.pcm) & Launch 24/7 Non-Stop Master RTMP Encoder
          # Decoding Video + Audio together inside ONE single Clip Feeder FFmpeg process and writing to raw headerless pipes
          # guarantees 100.0% lip-sync (single demuxer/seek trimmer) AND 0 container timestamp discontinuities across clip switches/loops!
          rm -f /tmp/vid_pipe.yuv /tmp/aud_pipe.pcm
          mkfifo /tmp/vid_pipe.yuv /tmp/aud_pipe.pcm
          exec 3<>/tmp/vid_pipe.yuv
          exec 4<>/tmp/aud_pipe.pcm

          # Seed 1.0s of black video + silent audio from a single FFmpeg process so Master Encoder initializes immediately with 0 A/V offset
          ffmpeg -y -hide_banner -loglevel error -re \
            -f lavfi -i color=c=black:s=1280x720:r=30 \
            -f lavfi -i anullsrc=r=44100:cl=stereo \
            -t 1.0 \
            -map 0:v:0 -f rawvideo -pix_fmt yuv420p /tmp/vid_pipe.yuv \
            -map 1:a:0 -f s16le -ar 44100 -ac 2 /tmp/aud_pipe.pcm >/dev/null 2>&1 &

          END_TIME=$(( $(date +%s) + DURATION_SEC ))

          # Background Persistent Master RTMP Encoder Supervisor (NEVER killed on clip change!)
          (
            while [ $(date +%s) -lt $END_TIME ]; do
              REM_ENC=$(( END_TIME - $(date +%s) ))
              if [ $REM_ENC -le 5 ]; then break; fi
              S_CTRL=$(curl -s "https://24.onairplayout.com/api/stream/status" 2>/dev/null || echo '{"active":true}')
              S_ACT=$(echo "$S_CTRL" | jq -r '.active // true' 2>/dev/null || echo "true")
              if [ "$S_ACT" = "false" ]; then
                sleep 2
                continue
              fi
              E_FPS=$(echo "$S_CTRL" | jq -r '.encoderConfig.fps // 30' 2>/dev/null | awk '{print int($1)}')
              if [ -z "$E_FPS" ] || [ "$E_FPS" -lt 15 ] || [ "$E_FPS" -gt 60 ]; then E_FPS=30; fi
              E_GOP=$(( E_FPS * 2 ))
              E_VB=$(echo "$S_CTRL" | jq -r '.encoderConfig.videoBitrate // 2500' 2>/dev/null | awk '{print int($1)}')
              if [ -z "$E_VB" ] || [ "$E_VB" -lt 800 ]; then E_VB=2500; fi
              E_MAX=$(( E_VB + 300 ))
              E_BUF=$(( E_VB * 2 ))
              E_AB=$(echo "$S_CTRL" | jq -r '.encoderConfig.audioBitrate // 128' 2>/dev/null | awk '{print int($1)}')
              if [ -z "$E_AB" ] || [ "$E_AB" -lt 64 ]; then E_AB=128; fi
              C_RTMP=$(echo "$S_CTRL" | jq -r '.encoderConfig.rtmpUrl // empty' 2>/dev/null || echo "")
              ACT_RTMP="${C_RTMP:-$RTMP_URL}"

              echo "[Master-RTMP-Encoder] Starting persistent 24/7 RTMP stream to $ACT_RTMP @ ${E_FPS}fps ${E_VB}kbps..."
              if echo "$ACT_RTMP" | grep -q "|"; then
                TEE_S=""
                IFS='|' read -ra ADDR <<< "$ACT_RTMP"
                for u in "${ADDR[@]}"; do
                  if [ -n "$TEE_S" ]; then TEE_S="${TEE_S}|"; fi
                  TEE_S="${TEE_S}[f=flv:onfail=ignore]${u}"
                done
                ffmpeg -hide_banner -loglevel warning -nostats -fflags +genpts \
                  -thread_queue_size 2048 -f rawvideo -pix_fmt yuv420p -video_size 1280x720 -framerate "$E_FPS" -i /tmp/vid_pipe.yuv \
                  -thread_queue_size 2048 -f x11grab -draw_mouse 0 -framerate "$E_FPS" -video_size 1280x720 -i :99.0 \
                  -thread_queue_size 2048 -f s16le -ar 44100 -ac 2 -i /tmp/aud_pipe.pcm \
                  -t "$REM_ENC" \
                  -filter_complex "[0:v]setpts=N/($E_FPS*TB),format=yuv420p[vid];[1:v]setpts=N/($E_FPS*TB),colorkey=0x000000:0.004:0.0[gfx];[vid][gfx]overlay=0:0:eof_action=pass:format=auto,format=yuv420p[outv];[2:a]asetpts=N/SR/TB[outa]" \
                  -map "[outv]" -map "[outa]" \
                  -c:v libx264 -preset veryfast -tune zerolatency -pix_fmt yuv420p -b:v "${E_VB}k" -maxrate "${E_MAX}k" -bufsize "${E_BUF}k" -g "$E_GOP" -keyint_min "$E_GOP" -sc_threshold 0 \
                  -c:a aac -ac 2 -b:a "${E_AB}k" -ar 44100 \
                  -flags +global_header -f tee "$TEE_S" || true
              else
                ffmpeg -hide_banner -loglevel warning -nostats -fflags +genpts \
                  -thread_queue_size 2048 -f rawvideo -pix_fmt yuv420p -video_size 1280x720 -framerate "$E_FPS" -i /tmp/vid_pipe.yuv \
                  -thread_queue_size 2048 -f x11grab -draw_mouse 0 -framerate "$E_FPS" -video_size 1280x720 -i :99.0 \
                  -thread_queue_size 2048 -f s16le -ar 44100 -ac 2 -i /tmp/aud_pipe.pcm \
                  -t "$REM_ENC" \
                  -filter_complex "[0:v]setpts=N/($E_FPS*TB),format=yuv420p[vid];[1:v]setpts=N/($E_FPS*TB),colorkey=0x000000:0.004:0.0[gfx];[vid][gfx]overlay=0:0:eof_action=pass:format=auto,format=yuv420p[outv];[2:a]asetpts=N/SR/TB[outa]" \
                  -map "[outv]" -map "[outa]" \
                  -c:v libx264 -preset veryfast -tune zerolatency -pix_fmt yuv420p -b:v "${E_VB}k" -maxrate "${E_MAX}k" -bufsize "${E_BUF}k" -g "$E_GOP" -keyint_min "$E_GOP" -sc_threshold 0 \
                  -c:a aac -ac 2 -b:a "${E_AB}k" -ar 44100 \
                  -f flv "$ACT_RTMP" || true
              fi
              sleep 1
            done
          ) &
          MASTER_ENC_SUP_PID=$!

          while [ $(date +%s) -lt $END_TIME ]; do
            REMAINING=$(( END_TIME - $(date +%s) ))
            if [ $REMAINING -le 5 ]; then break; fi

            # Check stream status & operator Encoder Config from 24.onairplayout.com/api/stream/status
            STREAM_CTRL=$(curl -s "https://24.onairplayout.com/api/stream/status" 2>/dev/null || echo '{"active":true}')
            IS_ACTIVE=$(echo "$STREAM_CTRL" | jq -r '.active // true' 2>/dev/null || echo "true")
            if [ "$IS_ACTIVE" = "false" ]; then
              pkill -f "virtual_speaker.monitor" || true
              sleep 2
              continue
            fi

            ENC_FPS=$(echo "$STREAM_CTRL" | jq -r '.encoderConfig.fps // 30' 2>/dev/null | awk '{print int($1)}')
            if [ -z "$ENC_FPS" ] || [ "$ENC_FPS" -lt 15 ] || [ "$ENC_FPS" -gt 60 ]; then ENC_FPS=30; fi

            # Query current program state & playlist from 24.onairplayout.com
            STATE_JSON=$(curl -s "https://24.onairplayout.com/api/program/state?uid=op_1790161020557" 2>/dev/null || echo "{}")
            SETTINGS_JSON=$(curl -s "https://24.onairplayout.com/api/operator/settings?uid=op_1790161020557" 2>/dev/null || echo "{}")
            PL_LEN=$(echo "$SETTINGS_JSON" | jq -r '.settings.playlist | length // 1' 2>/dev/null | awk '{print int($1)}')
            if [ -z "$PL_LEN" ] || [ "$PL_LEN" -lt 1 ]; then PL_LEN=1; fi

            VIDEO_NAME=$(echo "$STATE_JSON" | jq -r '.programItem.name // "Elite_Force_2026_S01E01_720p_HD.mp4"' 2>/dev/null || echo "Elite_Force_2026_S01E01_720p_HD.mp4")
            if [ -z "$VIDEO_NAME" ] || [ "$VIDEO_NAME" = "null" ]; then VIDEO_NAME="Elite_Force_2026_S01E01_720p_HD.mp4"; fi
            HF_URL=$(echo "$STATE_JSON" | jq -r '.programItem.hfResolveUrl // empty' 2>/dev/null || echo "")
            PATH_URL=$(echo "$STATE_JSON" | jq -r '.programItem.path // empty' 2>/dev/null || echo "")
            DURATION_VAL=$(echo "$STATE_JSON" | jq -r '.programItem.duration // 1919' 2>/dev/null | awk '{print int($1)}')
            if [ -z "$DURATION_VAL" ] || [ "$DURATION_VAL" -le 5 ]; then DURATION_VAL=1919; fi
            TIMECODE=$(echo "$STATE_JSON" | jq -r '.timecode // 0' 2>/dev/null | awk '{print int($1)}')
            if [ -z "$TIMECODE" ] || [ "$TIMECODE" -lt 8 ]; then
              TIMECODE=0
            fi
            if [ "$DURATION_VAL" -gt 10 ] && [ "$TIMECODE" -ge $(( DURATION_VAL - 4 )) ]; then
              TIMECODE=0
            fi

            # Detect YouTube ID if PATH_URL or HF_URL is a YouTube link or cached yt_<id>.mp4
            YT_ID=""
            if echo "$PATH_URL" | grep -qiE "youtube|youtu\.be"; then
              YT_ID=$(echo "$PATH_URL" | sed -nE 's/.*(v=|embed\/|youtu\.be\/|shorts\/|live\/)([a-zA-Z0-9_-]{11}).*/\2/p' | head -n 1)
            elif echo "$PATH_URL" | grep -q "/uploads/yt_"; then
              YT_ID=$(echo "$PATH_URL" | sed -nE 's/.*\/uploads\/yt_([a-zA-Z0-9_-]{11})\.mp4.*/\1/p' | head -n 1)
            fi

            if [ -n "$YT_ID" ]; then
              CACHE_FILE="/tmp/media_cache/yt_${YT_ID}.mp4"
              if [ ! -s "$CACHE_FILE" ]; then
                if curl -sI -f "https://24.onairplayout.com/uploads/yt_${YT_ID}.mp4" >/dev/null 2>&1; then
                  echo "Downloading cached YouTube MP4 from 24.onairplayout.com/uploads/yt_${YT_ID}.mp4..."
                  curl -sL "https://24.onairplayout.com/uploads/yt_${YT_ID}.mp4" -o "${CACHE_FILE}.tmp" && mv "${CACHE_FILE}.tmp" "$CACHE_FILE" || true
                fi
              fi
              if [ ! -s "$CACHE_FILE" ]; then
                echo "Downloading YouTube video $YT_ID via yt-dlp..."
                yt-dlp --js-runtimes node --concurrent-fragments 8 -f "18/best[height<=720][ext=mp4]/best[height<=720]" -o "${CACHE_FILE}.tmp" "https://www.youtube.com/watch?v=${YT_ID}" || true
                if [ -s "${CACHE_FILE}.tmp" ]; then
                  mv "${CACHE_FILE}.tmp" "$CACHE_FILE"
                  curl -s -X POST "https://24.onairplayout.com/api/upload-media" -H "Content-Type: application/octet-stream" -H "x-file-name: yt_${YT_ID}.mp4" --data-binary "@$CACHE_FILE" >/dev/null 2>&1 &
                fi
              fi
            else
              SAFE_CACHE_NAME=$(echo "$VIDEO_NAME" | sed 's/[^a-zA-Z0-9._-]/_/g')
              CACHE_FILE="/tmp/media_cache/${SAFE_CACHE_NAME}"
            fi

            if echo "$PATH_URL" | grep -q "^/uploads/"; then
              REMOTE_URL="https://24.onairplayout.com${PATH_URL}?_v=$(date +%s)"
            elif [ -n "$HF_URL" ] && [ "$HF_URL" != "null" ] && ! echo "$HF_URL" | grep -q "huggingface.co/buckets/"; then
              if echo "$HF_URL" | grep -q "?"; then
                REMOTE_URL="${HF_URL}&_v=$(date +%s)"
              else
                REMOTE_URL="${HF_URL}?_v=$(date +%s)"
              fi
            elif echo "$VIDEO_NAME" | grep -qi "Elite"; then
              REMOTE_URL="https://24.onairplayout.com/uploads/Elite_Force_2026_S01E01_720p_HD.mp4?_v=$(date +%s)"
            elif [ -n "$PATH_URL" ] && [ "$PATH_URL" != "null" ]; then
              if echo "$PATH_URL" | grep -q "^http"; then
                REMOTE_URL="$PATH_URL"
              else
                REMOTE_URL="https://24.onairplayout.com${PATH_URL}?_v=$(date +%s)"
              fi
            else
              REMOTE_URL="$DEFAULT_HF_VIDEO"
            fi

            if [ -s "$CACHE_FILE" ] && ! ffprobe -v error "$CACHE_FILE" >/dev/null 2>&1; then
              rm -f "$CACHE_FILE"
            fi

            if [ ! -s "$CACHE_FILE" ] && [ -z "$YT_ID" ]; then
              if ! echo "$VIDEO_NAME" | grep -qi "Elite"; then
                echo "Caching $VIDEO_NAME to local NVMe SSD ($CACHE_FILE)..."
                curl -sL "$REMOTE_URL" -o "${CACHE_FILE}.tmp" || true
                if [ -s "${CACHE_FILE}.tmp" ] && ffprobe -v error "${CACHE_FILE}.tmp" >/dev/null 2>&1; then
                  mv "${CACHE_FILE}.tmp" "$CACHE_FILE"
                else
                  rm -f "${CACHE_FILE}.tmp"
                fi
              fi
            fi

            if [ -s "$CACHE_FILE" ]; then
              INPUT_SOURCE="$CACHE_FILE"
              REAL_DUR=$(ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1:nokey=1 "$CACHE_FILE" 2>/dev/null | awk '{print int($1)}')
              if [ -n "$REAL_DUR" ] && [ "$REAL_DUR" -gt 5 ]; then
                DURATION_VAL="$REAL_DUR"
              fi
            else
              INPUT_SOURCE="$REMOTE_URL"
            fi

            FF_START_TS=$(date +%s)

            # Background watcher:
            # 1) Pushes exact live FFmpeg playback timecode to /api/program/live-timecode every 2s
            # 2) Pre-caches ALL queued playlist items in advance so next video starts in 0.05s
            # 3) On video switch, ONLY stops clip_feeder_audio (keeping Master RTMP Encoder 100% connected!)
            (
              while kill -0 $$ 2>/dev/null; do
                sleep 2
                NOW_TS=$(date +%s)
                ELAPSED=$(( NOW_TS - FF_START_TS ))
                RAW_TC=$(( TIMECODE + ELAPSED ))
                if [ "$PL_LEN" -le 1 ] && [ "$DURATION_VAL" -gt 5 ]; then
                  LIVE_TC=$(( RAW_TC % DURATION_VAL ))
                else
                  LIVE_TC=$RAW_TC
                fi
                curl -s -X POST "https://24.onairplayout.com/api/program/live-timecode?uid=op_1790161020557&from=worker" \
                  -H "Content-Type: application/json" \
                  -d "{\"uid\":\"op_1790161020557\",\"timecode\":$LIVE_TC,\"fromWorker\":true}" >/dev/null 2>&1 || true

                # Pre-cache any queued YouTube or MP4 items in the playlist in the background before their turn!
                SET_NOW=$(curl -s "https://24.onairplayout.com/api/operator/settings?uid=op_1790161020557" 2>/dev/null || echo "{}")
                PL_LEN_NOW=$(echo "$SET_NOW" | jq -r '.settings.playlist | length // 1' 2>/dev/null | awk '{print int($1)}')
                if [ -n "$PL_LEN_NOW" ] && [ "$PL_LEN_NOW" -gt 0 ]; then
                  PL_LEN=$PL_LEN_NOW
                  for Q_PATH in $(echo "$SET_NOW" | jq -r '.settings.playlist[]?.path // empty' 2>/dev/null); do
                    if echo "$Q_PATH" | grep -q "^/uploads/"; then
                      Q_FNAME=$(basename "$Q_PATH")
                      Q_LOCAL="/tmp/media_cache/${Q_FNAME}"
                      if [ ! -s "$Q_LOCAL" ] && [ ! -f "${Q_LOCAL}.Pre" ]; then
                        touch "${Q_LOCAL}.Pre"
                        (curl -sL "https://24.onairplayout.com${Q_PATH}" -o "${Q_LOCAL}.tmp" && mv "${Q_LOCAL}.tmp" "$Q_LOCAL"; rm -f "${Q_LOCAL}.Pre") &
                      fi
                    fi
                  done
                fi

                CTRL_NOW=$(curl -s "https://24.onairplayout.com/api/stream/status" 2>/dev/null || echo '{"active":true}')
                ACT_NOW=$(echo "$CTRL_NOW" | jq -r '.active // true' 2>/dev/null || echo "true")
                if [ "$ACT_NOW" = "false" ]; then
                  if [ -f /tmp/feeder_av.pid ]; then kill $(cat /tmp/feeder_av.pid) 2>/dev/null || true; fi
                  break
                fi

                ST_NOW=$(curl -s "https://24.onairplayout.com/api/program/state?uid=op_1790161020557" 2>/dev/null || echo "{}")
                NAME_NOW=$(echo "$ST_NOW" | jq -r '.programItem.name // empty' 2>/dev/null || echo "")
                PATH_NOW=$(echo "$ST_NOW" | jq -r '.programItem.path // empty' 2>/dev/null || echo "")
                if [ -n "$NAME_NOW" ] && [ "$NAME_NOW" != "null" ]; then
                  NEW_YT=""
                  if echo "$PATH_NOW" | grep -qiE "youtube|youtu\.be"; then
                    NEW_YT=$(echo "$PATH_NOW" | sed -nE 's/.*(v=|embed\/|youtu\.be\/|shorts\/|live\/)([a-zA-Z0-9_-]{11}).*/\2/p' | head -n 1)
                  elif echo "$PATH_NOW" | grep -q "/uploads/yt_"; then
                    NEW_YT=$(echo "$PATH_NOW" | sed -nE 's/.*\/uploads\/yt_([a-zA-Z0-9_-]{11})\.mp4.*/\1/p' | head -n 1)
                  fi
                  SAFE_NOW=$(echo "$NAME_NOW" | sed 's/[^a-zA-Z0-9._-]/_/g')
                  SAFE_CUR=$(echo "$VIDEO_NAME" | sed 's/[^a-zA-Z0-9._-]/_/g')

                  IS_SAME_CLIP="false"
                  if [ -n "$YT_ID" ] && [ -n "$NEW_YT" ] && [ "$YT_ID" = "$NEW_YT" ]; then
                    IS_SAME_CLIP="true"
                  elif [ -z "$YT_ID" ] && [ -z "$NEW_YT" ] && [ "$SAFE_NOW" = "$SAFE_CUR" ]; then
                    IS_SAME_CLIP="true"
                  fi

                  if [ "$IS_SAME_CLIP" = "false" ]; then
                    if [ -n "$NEW_YT" ] && [ ! -s "/tmp/media_cache/yt_${NEW_YT}.mp4" ]; then
                      if curl -sI -f "https://24.onairplayout.com/uploads/yt_${NEW_YT}.mp4" >/dev/null 2>&1; then
                        curl -sL "https://24.onairplayout.com/uploads/yt_${NEW_YT}.mp4" -o "/tmp/media_cache/yt_${NEW_YT}.mp4.tmp" && mv "/tmp/media_cache/yt_${NEW_YT}.mp4.tmp" "/tmp/media_cache/yt_${NEW_YT}.mp4" || true
                      else
                        yt-dlp --js-runtimes node --concurrent-fragments 8 -f "18/best[height<=720][ext=mp4]/best[height<=720]" -o "/tmp/media_cache/yt_${NEW_YT}.mp4.tmp" "https://www.youtube.com/watch?v=${NEW_YT}" || true
                        if [ -s "/tmp/media_cache/yt_${NEW_YT}.mp4.tmp" ]; then
                          mv "/tmp/media_cache/yt_${NEW_YT}.mp4.tmp" "/tmp/media_cache/yt_${NEW_YT}.mp4"
                          curl -s -X POST "https://24.onairplayout.com/api/upload-media" -H "Content-Type: application/octet-stream" -H "x-file-name: yt_${NEW_YT}.mp4" --data-binary "@/tmp/media_cache/yt_${NEW_YT}.mp4" >/dev/null 2>&1 &
                        fi
                      fi
                    fi
                    echo "Seamlessly switching single A/V Clip Feeder to $NAME_NOW ($PATH_NOW) without dropping RTMP..."
                    if [ -f /tmp/feeder_av.pid ]; then kill $(cat /tmp/feeder_av.pid) 2>/dev/null || true; fi
                    break
                  fi
                fi
              done
            ) &
            WATCHER_PID=$!

            echo "Feeding 100% Lip-Synced Video+Audio Clip: $VIDEO_NAME (Source: $INPUT_SOURCE) @ ${ENC_FPS}fps starting at ${TIMECODE}s..."
            ffmpeg -y -hide_banner -loglevel warning -nostats -fflags +genpts \
              -ss "$TIMECODE" -re -i "$INPUT_SOURCE" \
              -map 0:v:0 \
              -vf "scale=1280:720:force_original_aspect_ratio=decrease,pad=1280:720:(ow-iw)/2:(oh-ih)/2,fps=$ENC_FPS,format=yuv420p" \
              -f rawvideo -pix_fmt yuv420p /tmp/vid_pipe.yuv \
              -map 0:a:0 \
              -af "aresample=44100:async=1" \
              -f s16le -ar 44100 -ac 2 /tmp/aud_pipe.pcm &
            FEED_AV_PID=$!
            echo $FEED_AV_PID > /tmp/feeder_av.pid

            wait $FEED_AV_PID 2>/dev/null || true

            kill $WATCHER_PID 2>/dev/null || true
            # If a clip in a multi-item playlist finished naturally, notify the server that timecode reached DURATION_VAL so it immediately advances to the next clip
            if [ "$PL_LEN" -gt 1 ]; then
              curl -s -X POST "https://24.onairplayout.com/api/program/live-timecode?uid=op_1790161020557&from=worker" \
                -H "Content-Type: application/json" \
                -d "{\"uid\":\"op_1790161020557\",\"timecode\":$DURATION_VAL,\"fromWorker\":true}" >/dev/null 2>&1 || true
            else
              curl -s -X POST "https://24.onairplayout.com/api/program/live-timecode?uid=op_1790161020557&from=worker" \
                -H "Content-Type: application/json" \
                -d "{\"uid\":\"op_1790161020557\",\"timecode\":0,\"fromWorker\":true}" >/dev/null 2>&1 || true
            fi
          done
          kill $MASTER_ENC_SUP_PID 2>/dev/null || true
          exec 3>&-
          exec 4>&-
