name: OnAir 24x7 Cloud Broadcast Engine
run-name: "Broadcast ${{ inputs.rtmp_url || 'live_nadeem' }} (${{ inputs.feed_url || 'op_1790161020557' }})"

concurrency:
  group: broadcast-${{ inputs.rtmp_url || 'live_nadeem' }}
  cancel-in-progress: true

on:
  workflow_dispatch:
    inputs:
      feed_url:
        description: 'Program Output Feed URL'
        required: false
        default: 'https://www.onairplayout.com/?view=program&uid=op_1790161020557&overlay_only=1'
      rtmp_url:
        description: 'RTMP Destination URL(s) (pipe-separated for multiple)'
        required: false
        default: 'rtmp://rtmp.onairplayout.com:1935/live/live_nadeem'
      duration_sec:
        description: 'Stream duration in seconds (default 20700 = 5h45m)'
        required: false
        default: '20700'

jobs:
  broadcast:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      TZ: Asia/Karachi
    steps:
      - name: Checkout Engine
        uses: actions/checkout@v4

      - name: Configure Timezone, FFmpeg, Xvfb, Urdu Fonts & yt-dlp (Fast Setup)
        timeout-minutes: 4
        run: |
          set +e
          sudo ln -snf /usr/share/zoneinfo/Asia/Karachi /etc/localtime && echo "Asia/Karachi" | sudo tee /etc/timezone >/dev/null
          if ! command -v ffmpeg >/dev/null 2>&1 || ! command -v Xvfb >/dev/null 2>&1; then
            sudo systemctl kill -s SIGKILL apt-daily.service apt-daily-upgrade.service unattended-upgrades.service 2>/dev/null || true
            sudo killall -9 unattended-upgr apt apt-get dpkg 2>/dev/null || true
            sudo rm -f /var/lib/apt/lists/lock /var/cache/apt/archives/lock /var/lib/dpkg/lock /var/lib/dpkg/lock-frontend 2>/dev/null || true
            sudo dpkg --configure -a 2>/dev/null || true
            # Bypass slow/hanging azure.archive.ubuntu.com mirror immediately; use fast HTTPS kernel.org CDN mirror first
            sudo rm -rf /etc/apt/sources.list /etc/apt/sources.list.d/* 2>/dev/null || true
            CODENAME=$(. /etc/os-release 2>/dev/null && echo "${VERSION_CODENAME:-noble}")
            PKGS="xvfb xauth ca-certificates"
            if ! command -v ffmpeg >/dev/null 2>&1; then PKGS="$PKGS ffmpeg"; fi
            printf "deb https://mirrors.edge.kernel.org/ubuntu %s main restricted universe multiverse\ndeb https://mirrors.edge.kernel.org/ubuntu %s-updates main restricted universe multiverse\ndeb https://mirrors.edge.kernel.org/ubuntu %s-security main restricted universe multiverse\n" "$CODENAME" "$CODENAME" "$CODENAME" | sudo tee /etc/apt/sources.list.d/onair-fast.list >/dev/null
            APT_OPTS="-o Acquire::Retries=1 -o Acquire::http::Timeout=8 -o Acquire::https::Timeout=8 -o Dpkg::Options::=--force-confdef -o Dpkg::Options::=--force-confold"
            timeout 35 sudo DEBIAN_FRONTEND=noninteractive apt-get update $APT_OPTS -y || true
            timeout 45 sudo DEBIAN_FRONTEND=noninteractive apt-get install $APT_OPTS -y --no-install-recommends --fix-missing $PKGS || true
          fi
          if ! command -v ffmpeg >/dev/null 2>&1 || ! command -v Xvfb >/dev/null 2>&1; then
            sudo rm -rf /etc/apt/sources.list /etc/apt/sources.list.d/* 2>/dev/null || true
            CODENAME=$(. /etc/os-release 2>/dev/null && echo "${VERSION_CODENAME:-noble}")
            PKGS="xvfb xauth ca-certificates"
            if ! command -v ffmpeg >/dev/null 2>&1; then PKGS="$PKGS ffmpeg"; fi
            printf "deb http://archive.ubuntu.com/ubuntu %s main restricted universe multiverse\ndeb http://archive.ubuntu.com/ubuntu %s-updates main restricted universe multiverse\n" "$CODENAME" "$CODENAME" | sudo tee /etc/apt/sources.list.d/onair-fallback.list >/dev/null
            timeout 35 sudo DEBIAN_FRONTEND=noninteractive apt-get update -o Acquire::Retries=1 -o Acquire::http::Timeout=8 -y || true
            timeout 45 sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends --fix-missing $PKGS || true
          fi
          if ! command -v ffmpeg >/dev/null 2>&1; then
            curl -sL --max-time 30 "https://johnvansickle.com/ffmpeg/releases/ffmpeg-release-amd64-static.tar.xz" -o /tmp/ff.tar.xz && \
              sudo tar -xJf /tmp/ff.tar.xz -C /usr/local/bin --strip-components=1 --wildcards '*/ffmpeg' '*/ffprobe' && \
              rm -f /tmp/ff.tar.xz || true
          fi
          if ! command -v ffmpeg >/dev/null 2>&1 || ! command -v Xvfb >/dev/null 2>&1; then
            echo "FATAL: ffmpeg or Xvfb missing after setup"
            exit 1
          fi
          mkdir -p ~/.local/share/fonts ~/.config/fontconfig
          ORIG_RESOLVE="--resolve www.onairplayout.com:443:84.235.248.136"
          (curl -sfL --max-time 20 "https://cdn.jsdelivr.net/gh/nicholasgasior/gfonts-urdu@master/JameelNooriNastaleeq.ttf" -o ~/.local/share/fonts/JameelNooriNastaleeq.ttf || curl -skfL $ORIG_RESOLVE --max-time 60 "https://www.onairplayout.com/uploads/fonts/JameelNooriNastaleeq.ttf" -o ~/.local/share/fonts/JameelNooriNastaleeq.ttf) &
          curl -skfL $ORIG_RESOLVE --max-time 45 "https://www.onairplayout.com/uploads/fonts/Alvi_Nastaleeq.ttf" -o ~/.local/share/fonts/Alvi_Nastaleeq.ttf &
          curl -skfL $ORIG_RESOLVE --max-time 30 "https://www.onairplayout.com/uploads/fonts/Nafees%20Nastaleeq.ttf" -o "$HOME/.local/share/fonts/Nafees Nastaleeq.ttf" &
          curl -skfL $ORIG_RESOLVE --max-time 30 "https://www.onairplayout.com/uploads/fonts/Urdu_Emad_Nastaliq.ttf" -o ~/.local/share/fonts/Urdu_Emad_Nastaliq.ttf &
          wait
          if [ -s ~/.local/share/fonts/JameelNooriNastaleeq.ttf ]; then
            cp -f ~/.local/share/fonts/JameelNooriNastaleeq.ttf "$HOME/.local/share/fonts/Jameel Noori Nastaleeq.ttf"
          fi
          printf "%s\n" NotoNastaliqUrdu.ttf Gulzar-Regular.ttf Cairo-Bold.ttf Tajawal-Bold.ttf Almarai-Bold.ttf Vazirmatn-Bold.ttf NotoNaskhArabic-Bold.ttf ElMessiri-Bold.ttf Amiri-Bold.ttf NotoSansDevanagari.ttf Hind-Bold.ttf NotoSansBengali-Bold.ttf Outfit-Bold.ttf Inter-Bold.ttf Oswald-Bold.ttf BebasNeue-Regular.ttf Montserrat-Bold.ttf Poppins-Bold.ttf Roboto-Bold.ttf | \
            xargs -P 6 -I{} sh -c 'curl -skfL --resolve www.onairplayout.com:443:84.235.248.136 --max-time 20 "https://www.onairplayout.com/uploads/fonts/{}" -o "$HOME/.local/share/fonts/{}" 2>/dev/null || true'
          for F_URL in $(curl -sk $ORIG_RESOLVE --max-time 8 "https://www.onairplayout.com/api/fonts/list" 2>/dev/null | jq -r '.customFonts[]?.url // empty' 2>/dev/null); do
            F_BN=$(python3 -c "import urllib.parse, sys, os; print(os.path.basename(urllib.parse.unquote(sys.argv[1])))" "$F_URL" 2>/dev/null || basename "$F_URL")
            [ -s "$HOME/.local/share/fonts/${F_BN}" ] || curl -skfL $ORIG_RESOLVE --max-time 15 "https://www.onairplayout.com${F_URL}" -o "$HOME/.local/share/fonts/${F_BN}" || true
          done
          # Purge any non-font/HTML file so fontconfig is 100% pure binary fonts
          for FF in "$HOME/.local/share/fonts/"*; do
            [ -f "$FF" ] || continue
            if ! file "$FF" 2>/dev/null | grep -qiE "TrueType|OpenType|Web Open Font|font"; then
              rm -f "$FF"
            fi
          done
          cat > ~/.config/fontconfig/fonts.conf <<'FCEOF'
          <?xml version="1.0"?>
          <!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
          <fontconfig>
            <match target="font">
              <test name="family" compare="contains"><string>Nastaleeq</string></test>
              <edit name="embolden" mode="assign"><bool>false</bool></edit>
              <edit name="hinting" mode="assign"><bool>false</bool></edit>
            </match>
            <match target="font">
              <test name="family" compare="contains"><string>Nastaliq</string></test>
              <edit name="embolden" mode="assign"><bool>false</bool></edit>
              <edit name="hinting" mode="assign"><bool>false</bool></edit>
            </match>
          </fontconfig>
          FCEOF
          fc-cache -f ~/.local/share/fonts || true
          sudo curl -sL --max-time 15 https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp -o /usr/local/bin/yt-dlp && sudo chmod a+rx /usr/local/bin/yt-dlp || true

      - name: Launch 24/7 Headless Broadcast Studio (Local NVMe SSD + YouTube Bot-Bypass + Dynamic Encoder Settings)
        env:
          TZ: Asia/Karachi
          FEED_URL: ${{ inputs.feed_url || 'https://www.onairplayout.com/?view=program&uid=op_1790161020557&overlay_only=1' }}
          RTMP_URL: ${{ inputs.rtmp_url || 'rtmp://rtmp.onairplayout.com:1935/live/live_nadeem' }}
          DURATION_SEC: ${{ inputs.duration_sec || '20700' }}
        run: |
          set +e
          export TZ=Asia/Karachi
          export PATH="$HOME/.local/bin:/usr/local/bin:$PATH"
          if ! echo "$FEED_URL" | grep -q "overlay_only=1"; then
            FEED_URL="${FEED_URL}&overlay_only=1"
          fi
          OP_UID=$(echo "$FEED_URL" | sed -nE 's/.*[?&]uid=([^&]+).*/\1/p')
          if [ -z "$OP_UID" ]; then OP_UID="op_1790161020557"; fi
          echo "Cloud Broadcast Worker initialized for OP_UID=$OP_UID -> RTMP=$RTMP_URL"

          mkdir -p /tmp/media_cache

          ensure_stage_display() {
            local TW="$1"
            local TH="$2"
            local FORCE_HEAL="${3:-}"
            local TARGET="${TW}x${TH}"
            local CUR=""
            if [ -f /tmp/current_stage_res ]; then CUR=$(cat /tmp/current_stage_res 2>/dev/null || echo ""); fi
            if [ "$CUR" = "$TARGET" ] && pgrep -f "Xvfb :99" >/dev/null 2>&1; then
              if [ "$FORCE_HEAL" != "force" ] && pgrep -f "chrome-prof" >/dev/null 2>&1 && pgrep -f -- "--type=renderer" >/dev/null 2>&1; then
                return 0
              fi
              if [ "$FORCE_HEAL" = "force" ]; then
                if ! curl -sk --max-time 6 --resolve www.onairplayout.com:443:84.235.248.136 "${FEED_URL}" 2>/dev/null | grep -q 'id="root"'; then
                  echo "[Stage-Display] Origin busy during scheduled Chrome refresh -> deferring refresh to keep live tickers uninterrupted."
                  return 0
                fi
              fi
              echo "[Stage-Display] Zero-downtime healing Chrome renderer on existing ${TARGET} Xvfb :99 (FORCE=${FORCE_HEAL:-auto})..."
              xsetroot -display :99 -solid "#000000" 2>/dev/null || true
              pkill -9 -f "chrome-prof" 2>/dev/null || true
              pkill -9 -f "/opt/google/chrome/chrome" 2>/dev/null || true
              sleep 0.4
              rm -rf /tmp/chrome-prof/Default/Cache /tmp/chrome-prof/Default/"Code Cache" /tmp/chrome-prof/Default/GPUCache 2>/dev/null || true
            else
              echo "[Stage-Display] Launching native ${TARGET} Xvfb + Chrome 1:1 Broadcast Overlay Stage..."
              pkill -9 -f "chrome-prof" 2>/dev/null || true
              pkill -f "Xvfb :99" 2>/dev/null || true
              sleep 1
              rm -f /tmp/.X99-lock /tmp/.X11-unix/X99 2>/dev/null || true
              Xvfb :99 -screen 0 "${TW}x${TH}x24" -ac +extension GLX +render +extension MIT-SHM -noreset &
              export DISPLAY=:99
              sleep 1.5
              xsetroot -display :99 -solid "#000000" 2>/dev/null || true
            fi
            export DISPLAY=:99
            mkdir -p /tmp/chrome-prof
            rm -f /tmp/chrome-prof/SingletonLock /tmp/chrome-prof/SingletonCookie /tmp/chrome-prof/SingletonSocket 2>/dev/null || true
            touch "/tmp/chrome-prof/First Run"
            # Pre-verify direct origin serves valid studio root HTML before opening Chrome (zero error-page risk)
            for _chk in 1 2 3 4 5; do
              if curl -sk --max-time 6 --resolve www.onairplayout.com:443:84.235.248.136 "${FEED_URL}" 2>/dev/null | grep -q 'id="root"'; then
                break
              fi
              sleep 1
            done
            DBUS_SESSION_BUS_ADDRESS=/dev/null TZ=Asia/Karachi google-chrome \
              --no-sandbox \
              --disable-dev-shm-usage \
              --default-background-color=000000ff \
              --host-resolver-rules="MAP www.onairplayout.com 84.235.248.136,MAP onairplayout.com 84.235.248.136" \
              --ignore-certificate-errors \
              --mute-audio \
              --font-render-hinting=none \
              --force-device-scale-factor=1 \
              --no-first-run \
              --no-default-browser-check \
              --disable-search-engine-choice-screen \
              --user-data-dir=/tmp/chrome-prof \
              --disk-cache-size=33554432 \
              --media-cache-size=16777216 \
              --js-flags="--max-old-space-size=512" \
              --renderer-process-limit=2 \
              --disable-extensions \
              --disable-component-update \
              --disable-features=Translate,OptimizationHints,MediaRouter \
              --disable-gpu \
              --disable-background-timer-throttling \
              --disable-renderer-backgrounding \
              --disable-backgrounding-occluded-windows \
              --disable-ipc-flooding-protection \
              --autoplay-policy=no-user-gesture-required \
              --window-size="${TW},${TH}" \
              --window-position=0,0 \
              --kiosk \
              --hide-scrollbars \
              --disable-infobars \
              --disable-notifications \
              --app="${FEED_URL}&_cb=$(date +%s)" >/dev/null 2>&1 &
            echo "$TARGET" > /tmp/current_stage_res
            date +%s > /tmp/last_chrome_heal_ts
            if [ "$FORCE_HEAL" = "force" ]; then
              sleep 2
            else
              echo "Waiting 4 seconds for ${TARGET} Output Feed & Urdu Tickers to render in Pakistan Time (Asia/Karachi)..."
              sleep 4
            fi
          }

          INIT_CTRL=$(curl -s "https://www.onairplayout.com/api/stream/status?uid=${OP_UID}&worker=1" 2>/dev/null || echo '{"active":true}')
          INIT_RES=$(echo "$INIT_CTRL" | jq -r '.encoderConfig.resolution // "854x480"' 2>/dev/null || echo "854x480")
          if [ "$INIT_RES" = "1920x1080" ]; then
            ensure_stage_display 1920 1080
          else
            ensure_stage_display 1280 720
          fi
          export DISPLAY=:99

          STAGE_WD_END=$(( $(date +%s) + DURATION_SEC ))
          (
            while [ $(date +%s) -lt $STAGE_WD_END ]; do
              sleep 15
              CUR_STG=$(cat /tmp/current_stage_res 2>/dev/null || echo "1280x720")
              W_STG=$(echo "$CUR_STG" | cut -dx -f1)
              H_STG=$(echo "$CUR_STG" | cut -dx -f2)
              if pgrep -f "Xvfb :99" >/dev/null 2>&1 && ! pgrep -f -- "--type=renderer" >/dev/null 2>&1; then
                sleep 2
                if pgrep -f "Xvfb :99" >/dev/null 2>&1 && ! pgrep -f -- "--type=renderer" >/dev/null 2>&1; then
                  echo "[Auto-Heal-Watchdog] Chrome renderer exited — relaunching cleanly on live Xvfb..."
                  ensure_stage_display "${W_STG:-1280}" "${H_STG:-720}" "force"
                  continue
                fi
              fi
              # Emergency Memory Runaway Guard ONLY (in-page ONAIR-AUTO-HEAL-V109 handles zero-blink routine cache trimming!)
              CH_PIDS=$(pgrep -f "chrome-prof" 2>/dev/null | tr '\n' ',' | sed 's/,$//')
              CH_RSS_MB=0
              if [ -n "$CH_PIDS" ]; then
                CH_RSS_MB=$(ps -o rss= -p "$CH_PIDS" 2>/dev/null | awk '{s+=$1} END {print int(s/1024)}')
              fi
              if [ "${CH_RSS_MB:-0}" -ge 1800 ]; then
                echo "[Auto-Heal-Watchdog] Emergency memory recovery (RSS=${CH_RSS_MB}MB >= 1800MB) cleanly on live Xvfb..."
                ensure_stage_display "${W_STG:-1280}" "${H_STG:-720}" "force"
              fi
            done
          ) &
          STAGE_WATCHDOG_PID=$!

          # 4. Create Persistent Single Muxed A/V FIFO (/tmp/muxed_av.ts) & Launch 24/7 Non-Stop Master RTMP Encoder
          # Decoding Video + Audio together inside ONE single Clip Feeder FFmpeg process with accurate seek (no -noaccurate_seek),
          # fps=start_time=0, and aresample=async=1000:first_pts=0 guarantees 100.0% frame-locked lip-sync across seeks and clip switches!
          rm -f /tmp/muxed_av.ts /tmp/feeder_av.pid /tmp/feeder_av.spec
          mkfifo /tmp/muxed_av.ts
          exec 3<>/tmp/muxed_av.ts

          END_TIME=$(( $(date +%s) + DURATION_SEC ))

          # Background Persistent Master RTMP Encoder Supervisor (NEVER killed on clip change!)
          (
            while [ $(date +%s) -lt $END_TIME ]; do
              REM_ENC=$(( END_TIME - $(date +%s) ))
              if [ $REM_ENC -le 5 ]; then break; fi
              S_CTRL=$(curl -s "https://www.onairplayout.com/api/stream/status?uid=${OP_UID}&worker=1" 2>/dev/null || echo '{"active":true}')
              S_ACT=$(echo "$S_CTRL" | jq -r '.active // true' 2>/dev/null || echo "true")
              if [ "$S_ACT" = "false" ]; then
                sleep 2
                continue
              fi
              E_RES=$(echo "$S_CTRL" | jq -r '.encoderConfig.resolution // "1280x720"' 2>/dev/null || echo "1280x720")
              case "$E_RES" in
                1920x1080) STAGE_W=1920; STAGE_H=1080; SCALE_OUT="" ;;
                854x480)   STAGE_W=1280; STAGE_H=720;  SCALE_OUT=",scale=854:480:flags=lanczos" ;;
                *)         E_RES="1280x720"; STAGE_W=1280; STAGE_H=720; SCALE_OUT="" ;;
              esac
              ensure_stage_display "$STAGE_W" "$STAGE_H"

              E_FPS=$(echo "$S_CTRL" | jq -r '.encoderConfig.fps // 30' 2>/dev/null | awk '{print int($1)}')
              if [ -z "$E_FPS" ] || [ "$E_FPS" -lt 15 ]; then E_FPS=30; fi
              if [ "$E_FPS" -gt 60 ]; then E_FPS=60; fi
              E_GOP=$(( E_FPS * 2 ))

              E_VB=$(echo "$S_CTRL" | jq -r '.encoderConfig.videoBitrate // 2000' 2>/dev/null | awk '{print int($1)}')
              if [ -z "$E_VB" ] || [ "$E_VB" -lt 800 ]; then E_VB=2000; fi
              if [ "$E_VB" -gt 8000 ]; then
                ACT_VB=8000
              else
                ACT_VB="$E_VB"
              fi
              E_MIN=$(( ACT_VB * 85 / 100 ))
              E_MAX=$(( ACT_VB + 400 ))
              E_BUF=$(( ACT_VB * 2 ))

              E_AB=$(echo "$S_CTRL" | jq -r '.encoderConfig.audioBitrate // 128' 2>/dev/null | awk '{print int($1)}')
              if [ -z "$E_AB" ] || [ "$E_AB" -lt 64 ]; then E_AB=128; fi
              if [ "$E_AB" -gt 320 ]; then E_AB=320; fi

              C_RTMP=$(echo "$S_CTRL" | jq -r '.encoderConfig.rtmpUrl // empty' 2>/dev/null || echo "")
              ACT_RTMP="${C_RTMP:-$RTMP_URL}"
              ENC_SIG="${E_RES}:${E_FPS}:${ACT_VB}:${E_AB}:${ACT_RTMP}"
              DESIRED_SPEC="${STAGE_W}x${STAGE_H}:${E_FPS}"

              if [ "$STAGE_W" -ge 1920 ] && [ "$E_FPS" -ge 50 ]; then
                X264_PRESET="superfast"
              else
                X264_PRESET="veryfast"
              fi

              # Ensure Clip Feeder matches exact stage resolution & FPS before probing /tmp/muxed_av.ts
              CUR_F_SPEC=$(cat /tmp/feeder_av.spec 2>/dev/null || echo "")
              if [ -n "$CUR_F_SPEC" ] && [ "$CUR_F_SPEC" != "$DESIRED_SPEC" ]; then
                touch /tmp/clip_switched_by_watcher
                if [ -f /tmp/feeder_av.pid ]; then kill -TERM $(cat /tmp/feeder_av.pid 2>/dev/null) 2>/dev/null || true; fi
                sleep 0.3
                dd if=/tmp/muxed_av.ts iflag=nonblock of=/dev/null bs=65536 count=8 2>/dev/null || true
              fi

              # Wait briefly for Clip Feeder to start writing clean MPEG-TS packets at matching spec
              for _w in $(seq 1 60); do
                CUR_F_SPEC=$(cat /tmp/feeder_av.spec 2>/dev/null || echo "")
                if [ -f /tmp/feeder_av.pid ] && kill -0 $(cat /tmp/feeder_av.pid 2>/dev/null) 2>/dev/null && [ "$CUR_F_SPEC" = "$DESIRED_SPEC" ]; then
                  break
                fi
                sleep 0.1
              done

              GRAB_FPS=$(( E_FPS + 3 ))
              if [ "$GRAB_FPS" -gt 62 ]; then GRAB_FPS=62; fi
              echo "[Master-RTMP-Encoder] Starting High-Profile 24/7 RTMP/UDP stream to $ACT_RTMP @ ${E_RES} (stage ${STAGE_W}x${STAGE_H}) ${E_FPS}fps (x11grab=${GRAB_FPS}fps q=4 zero-lag) ${ACT_VB}kbps preset=${X264_PRESET} (audio ${E_AB}kbps, 48kHz zero-drift, live tickers)..."
              if echo "$ACT_RTMP" | grep -q "|"; then
                TEE_S=""
                IFS='|' read -ra ADDR <<< "$ACT_RTMP"
                for u in "${ADDR[@]}"; do
                  if [ -n "$TEE_S" ]; then TEE_S="${TEE_S}|"; fi
                  if echo "$u" | grep -qiE "^(udp|srt)://"; then
                    TEE_S="${TEE_S}[f=mpegts:onfail=ignore]${u}"
                  else
                    TEE_S="${TEE_S}[f=flv:onfail=ignore]${u}"
                  fi
                done
                ffmpeg -nostdin -hide_banner -loglevel warning -nostats -fflags +genpts+igndts \
                  -probesize 262144 -analyzeduration 300000 -thread_queue_size 1024 -f mpegts -i /tmp/muxed_av.ts \
                  -thread_queue_size 4 -f x11grab -draw_mouse 0 -framerate "$GRAB_FPS" -video_size "${STAGE_W}x${STAGE_H}" -i :99.0 \
                  -t "$REM_ENC" \
                  -filter_complex_threads 4 \
                  -filter_complex "[0:v]setpts=N/(${E_FPS}*TB),format=yuv420p[vid];[1:v]setpts=N/(${E_FPS}*TB),format=rgba,colorkey=0x000000:0.01:0.0[gfx];[vid][gfx]overlay=0:0:eof_action=pass:repeatlast=1:format=yuv420${SCALE_OUT},format=yuv420p[outv];[0:a]asetpts=N/SR/TB[outa]" \
                  -map "[outv]" -map "[outa]" \
                  -c:v libx264 -preset "$X264_PRESET" -profile:v high -bf 2 -pix_fmt yuv420p -b:v "${ACT_VB}k" -minrate "${ACT_VB}k" -maxrate "${ACT_VB}k" -bufsize "${E_BUF}k" -x264-params "nal-hrd=cbr:force-cfr=1:rc-lookahead=12" -g "$E_GOP" -keyint_min "$E_GOP" -sc_threshold 0 \
                  -c:a aac -ac 2 -b:a "${E_AB}k" -ar 48000 \
                  -flags +global_header -f tee "$TEE_S" &
                M_ENC_PID=$!
              else
                OUT_FMT="flv"
                if echo "$ACT_RTMP" | grep -qiE "^(udp|srt)://"; then OUT_FMT="mpegts"; fi
                ffmpeg -nostdin -hide_banner -loglevel warning -nostats -fflags +genpts+igndts \
                  -probesize 262144 -analyzeduration 300000 -thread_queue_size 1024 -f mpegts -i /tmp/muxed_av.ts \
                  -thread_queue_size 4 -f x11grab -draw_mouse 0 -framerate "$GRAB_FPS" -video_size "${STAGE_W}x${STAGE_H}" -i :99.0 \
                  -t "$REM_ENC" \
                  -filter_complex_threads 4 \
                  -filter_complex "[0:v]setpts=N/(${E_FPS}*TB),format=yuv420p[vid];[1:v]setpts=N/(${E_FPS}*TB),format=rgba,colorkey=0x000000:0.01:0.0[gfx];[vid][gfx]overlay=0:0:eof_action=pass:repeatlast=1:format=yuv420${SCALE_OUT},format=yuv420p[outv];[0:a]asetpts=N/SR/TB[outa]" \
                  -map "[outv]" -map "[outa]" \
                  -c:v libx264 -preset "$X264_PRESET" -profile:v high -bf 2 -pix_fmt yuv420p -b:v "${ACT_VB}k" -minrate "${ACT_VB}k" -maxrate "${ACT_VB}k" -bufsize "${E_BUF}k" -x264-params "nal-hrd=cbr:force-cfr=1:rc-lookahead=12" -g "$E_GOP" -keyint_min "$E_GOP" -sc_threshold 0 \
                  -c:a aac -ac 2 -b:a "${E_AB}k" -ar 48000 \
                  -f "$OUT_FMT" "$ACT_RTMP" &
                M_ENC_PID=$!
              fi
              # Live Encoder Settings Watcher: if operator saves new Bitrate, Resolution, FPS, Audio, or RTMP URL, apply immediately!
              (
                while kill -0 "$M_ENC_PID" 2>/dev/null; do
                  sleep 3
                  CHK_C=$(curl -s "https://www.onairplayout.com/api/stream/status?uid=${OP_UID}&worker=1" 2>/dev/null || echo "")
                  if [ -z "$CHK_C" ]; then continue; fi
                  CHK_ACT=$(echo "$CHK_C" | jq -r '.active // true' 2>/dev/null || echo "true")
                  if [ "$CHK_ACT" = "false" ]; then
                    kill "$M_ENC_PID" 2>/dev/null || true
                    break
                  fi
                  N_RES=$(echo "$CHK_C" | jq -r '.encoderConfig.resolution // "1280x720"' 2>/dev/null || echo "1280x720")
                  case "$N_RES" in 1920x1080|854x480) ;; *) N_RES="1280x720" ;; esac
                  N_FPS=$(echo "$CHK_C" | jq -r '.encoderConfig.fps // 30' 2>/dev/null | awk '{print int($1)}')
                  if [ -z "$N_FPS" ] || [ "$N_FPS" -lt 15 ]; then N_FPS=30; fi
                  if [ "$N_FPS" -gt 60 ]; then N_FPS=60; fi
                  N_VB=$(echo "$CHK_C" | jq -r '.encoderConfig.videoBitrate // 2000' 2>/dev/null | awk '{print int($1)}')
                  if [ -z "$N_VB" ] || [ "$N_VB" -lt 800 ]; then N_VB=2000; fi
                  if [ "$N_VB" -gt 8000 ]; then N_VB=8000; fi
                  N_AB=$(echo "$CHK_C" | jq -r '.encoderConfig.audioBitrate // 128' 2>/dev/null | awk '{print int($1)}')
                  if [ -z "$N_AB" ] || [ "$N_AB" -lt 64 ]; then N_AB=128; fi
                  if [ "$N_AB" -gt 320 ]; then N_AB=320; fi
                  N_CR=$(echo "$CHK_C" | jq -r '.encoderConfig.rtmpUrl // empty' 2>/dev/null || echo "")
                  N_RTMP="${N_CR:-$RTMP_URL}"
                  N_SIG="${N_RES}:${N_FPS}:${N_VB}:${N_AB}:${N_RTMP}"
                  if [ "$N_SIG" != "$ENC_SIG" ]; then
                    echo "[Master-RTMP-Encoder] Applying updated Encoder Settings: $N_SIG"
                    kill "$M_ENC_PID" 2>/dev/null || true
                    break
                  fi
                done
              ) &
              CFG_WATCH_PID=$!
              wait "$M_ENC_PID" 2>/dev/null || true
              kill "$CFG_WATCH_PID" 2>/dev/null || true
              # Restart Clip Feeder on Master Encoder restart & drain pipe so /tmp/muxed_av.ts starts on a fresh PAT/PMT boundary
              if [ -f /tmp/feeder_av.pid ]; then
                touch /tmp/clip_switched_by_watcher
                kill -TERM $(cat /tmp/feeder_av.pid 2>/dev/null) 2>/dev/null || true
              fi
              sleep 0.3
              dd if=/tmp/muxed_av.ts iflag=nonblock of=/dev/null bs=65536 count=8 2>/dev/null || true
              sleep 0.7
            done
          ) &
          MASTER_ENC_SUP_PID=$!

          while [ $(date +%s) -lt $END_TIME ]; do
            REMAINING=$(( END_TIME - $(date +%s) ))
            if [ $REMAINING -le 5 ]; then break; fi

            # Check stream status & operator Encoder Config from www.onairplayout.com/api/stream/status
            STREAM_CTRL=$(curl -s "https://www.onairplayout.com/api/stream/status?uid=${OP_UID}&worker=1" 2>/dev/null || echo '{"active":true}')
            IS_ACTIVE=$(echo "$STREAM_CTRL" | jq -r '.active // true' 2>/dev/null || echo "true")
            if [ "$IS_ACTIVE" = "false" ]; then
              pkill -f "virtual_speaker.monitor" || true
              sleep 2
              continue
            fi

            ENC_RES=$(echo "$STREAM_CTRL" | jq -r '.encoderConfig.resolution // "1280x720"' 2>/dev/null || echo "1280x720")
            if [ "$ENC_RES" = "1920x1080" ]; then
              FEED_W=1920
              FEED_H=1080
            else
              FEED_W=1280
              FEED_H=720
            fi
            ENC_FPS=$(echo "$STREAM_CTRL" | jq -r '.encoderConfig.fps // 30' 2>/dev/null | awk '{print int($1)}')
            if [ -z "$ENC_FPS" ] || [ "$ENC_FPS" -lt 15 ]; then ENC_FPS=30; fi
            if [ "$ENC_FPS" -gt 60 ]; then ENC_FPS=60; fi

            # Auto-prune /tmp/media_cache if > 6000 MB so 24/7 runner disk never fills up
            MC_MB=$(du -sm /tmp/media_cache 2>/dev/null | awk '{print int($1)}')
            if [ "${MC_MB:-0}" -gt 6000 ]; then
              ls -1tr /tmp/media_cache/*.mp4 2>/dev/null | head -n 4 | xargs -r rm -f 2>/dev/null || true
            fi

            # Query current program state & playlist from www.onairplayout.com (worker=1 auto-resolves to next Cloud playlist item if Local PC file is selected)
            STATE_JSON=$(curl -s "https://www.onairplayout.com/api/program/state?uid=${OP_UID}&worker=1" 2>/dev/null || echo "{}")
            curl -s "https://www.onairplayout.com/api/operator/settings?uid=${OP_UID}" -o /tmp/cur_op_settings.json 2>/dev/null || echo "{}" > /tmp/cur_op_settings.json
            MAIN_PL_LEN=$(jq -r '(.settings.playlist // []) | length' /tmp/cur_op_settings.json 2>/dev/null | awk '{print int($1)}')
            if [ -z "$MAIN_PL_LEN" ] || [ "$MAIN_PL_LEN" -lt 0 ]; then MAIN_PL_LEN=0; fi
            PL_LEN=$(jq -r '((.settings.playlist // []) | length) + ((.settings.gapFiller // []) | length)' /tmp/cur_op_settings.json 2>/dev/null | awk '{print int($1)}')
            if [ -z "$PL_LEN" ] || [ "$PL_LEN" -lt 0 ]; then PL_LEN=0; fi
            IS_CUR_GF=$(echo "$STATE_JSON" | jq -r '.programItem.isGapFiller // false' 2>/dev/null || echo "false")

            VIDEO_NAME=$(echo "$STATE_JSON" | jq -r '.programItem.name // empty' 2>/dev/null || echo "")
            if [ "$VIDEO_NAME" = "null" ]; then VIDEO_NAME=""; fi
            HF_URL=$(echo "$STATE_JSON" | jq -r '.programItem.hfResolveUrl // empty' 2>/dev/null || echo "")
            PATH_URL=$(echo "$STATE_JSON" | jq -r '.programItem.path // empty' 2>/dev/null || echo "")
            DURATION_VAL=$(echo "$STATE_JSON" | jq -r '.programItem.duration // 1919' 2>/dev/null | awk '{print int($1)}')
            if [ -z "$DURATION_VAL" ] || [ "$DURATION_VAL" -le 5 ]; then DURATION_VAL=1919; fi
            TIMECODE=$(echo "$STATE_JSON" | jq -r '.timecode // 0' 2>/dev/null | awk '{print int($1)}')
            CUR_CHECK_CLIP=$(echo "$VIDEO_NAME" | sed 's/[^a-zA-Z0-9._-]/_/g')
            if [ -n "$LAST_FINISHED_CLIP" ] && { [ "$IS_CUR_GF" != "true" ] || [ "$MAIN_PL_LEN" -gt 0 ] || [ "$PL_LEN" -gt 1 ]; } && [ "$CUR_CHECK_CLIP" = "$LAST_FINISHED_CLIP" ]; then
              ADV_TRY=$(curl -s -X POST "https://www.onairplayout.com/api/program/live-timecode?uid=${OP_UID}&from=worker" \
                -H "Content-Type: application/json" \
                -d "{\"uid\":\"${OP_UID}\",\"timecode\":$DURATION_VAL,\"fromWorker\":true,\"advanceNext\":true,\"clipName\":\"$CUR_CHECK_CLIP\"}" 2>/dev/null || echo "{}")
              sleep 0.25
              STATE_JSON=$(curl -s "https://www.onairplayout.com/api/program/state?uid=${OP_UID}&worker=1" 2>/dev/null || echo "{}")
              VIDEO_NAME=$(echo "$STATE_JSON" | jq -r '.programItem.name // empty' 2>/dev/null || echo "")
              if [ "$VIDEO_NAME" = "null" ]; then VIDEO_NAME=""; fi
              HF_URL=$(echo "$STATE_JSON" | jq -r '.programItem.hfResolveUrl // empty' 2>/dev/null || echo "")
              PATH_URL=$(echo "$STATE_JSON" | jq -r '.programItem.path // empty' 2>/dev/null || echo "")
              DURATION_VAL=$(echo "$STATE_JSON" | jq -r '.programItem.duration // 1919' 2>/dev/null | awk '{print int($1)}')
              if [ -z "$DURATION_VAL" ] || [ "$DURATION_VAL" -le 5 ]; then DURATION_VAL=1919; fi
              TIMECODE=$(echo "$STATE_JSON" | jq -r '.timecode // 0' 2>/dev/null | awk '{print int($1)}')
              RECHECK_CLIP=$(echo "$VIDEO_NAME" | sed 's/[^a-zA-Z0-9._-]/_/g')
              if [ "$RECHECK_CLIP" = "$LAST_FINISHED_CLIP" ]; then
                # Fallback: directly select next item from playlist/gapFiller so finished clip NEVER flashes 0:00 frame!
                NEXT_FB_JSON=$(jq -c --arg cur "$VIDEO_NAME" '
                  ((.settings.playlist // []) | if length > 0 then . else (.settings.gapFiller // []) end) as $list |
                  if ($list | length) > 1 then
                    ([$list | to_entries[] | select(.value.name == $cur) | .key][0] // 0) as $idx |
                    $list[(($idx + 1) % ($list | length))]
                  else empty end
                ' /tmp/cur_op_settings.json 2>/dev/null || echo "")
                if [ -n "$NEXT_FB_JSON" ] && [ "$NEXT_FB_JSON" != "null" ]; then
                  VIDEO_NAME=$(echo "$NEXT_FB_JSON" | jq -r '.name // empty' 2>/dev/null || echo "$VIDEO_NAME")
                  HF_URL=$(echo "$NEXT_FB_JSON" | jq -r '.hfResolveUrl // empty' 2>/dev/null || echo "")
                  PATH_URL=$(echo "$NEXT_FB_JSON" | jq -r '.path // empty' 2>/dev/null || echo "")
                  DURATION_VAL=$(echo "$NEXT_FB_JSON" | jq -r '.duration // 1919' 2>/dev/null | awk '{print int($1)}')
                  if [ -z "$DURATION_VAL" ] || [ "$DURATION_VAL" -le 5 ]; then DURATION_VAL=1919; fi
                  TIMECODE=0
                fi
              fi
            fi
            LAST_FINISHED_CLIP=""
            if [ -z "$TIMECODE" ] || [ "$TIMECODE" -lt 2 ]; then
              TIMECODE=0
            fi
            if [ "$DURATION_VAL" -gt 10 ] && [ "$TIMECODE" -ge $(( DURATION_VAL - 4 )) ]; then
              TIMECODE=0
            fi

            YT_ID=$(echo "$STATE_JSON" | jq -r '.programItem.ytId // empty' 2>/dev/null || echo "")
            if [ "$YT_ID" = "null" ]; then YT_ID=""; fi
            INPUT_SOURCE=""
            if [ -n "$VIDEO_NAME" ]; then
              # Detect YouTube ID if PATH_URL or HF_URL is a YouTube link or cached yt_<id>.mp4
              if [ -z "$YT_ID" ]; then
                if echo "$PATH_URL" | grep -qiE "youtube|youtu\.be"; then
                  YT_ID=$(echo "$PATH_URL" | sed -nE 's/.*(v=|embed\/|youtu\.be\/|shorts\/|live\/)([a-zA-Z0-9_-]{11}).*/\2/p' | head -n 1)
                elif echo "$PATH_URL" | grep -q "/uploads/yt_"; then
                  YT_ID=$(echo "$PATH_URL" | sed -nE 's/.*\/uploads\/yt_([a-zA-Z0-9_-]{11})\.mp4.*/\1/p' | head -n 1)
                fi
              fi

              if [ -n "$YT_ID" ]; then
                CACHE_FILE="/tmp/media_cache/yt_${YT_ID}.mp4"
                if [ ! -s "$CACHE_FILE" ]; then
                  if curl -sI -f "http://84.235.248.136/uploads/yt_${YT_ID}.mp4" >/dev/null 2>&1; then
                    PATH_URL="/uploads/yt_${YT_ID}.mp4"
                    if [ ! -f "${CACHE_FILE}.dl" ]; then
                      touch "${CACHE_FILE}.dl"
                      (curl -sL "http://84.235.248.136/uploads/yt_${YT_ID}.mp4" -o "${CACHE_FILE}.tmp" && mv "${CACHE_FILE}.tmp" "$CACHE_FILE"; rm -f "${CACHE_FILE}.dl") &
                    fi
                  else
                    curl -s -X POST "https://www.onairplayout.com/api/youtube/prefetch?ytId=${YT_ID}&uid=${OP_UID}&directOnly=1" >/dev/null 2>&1 &
                    VIDEO_NAME=""
                    PATH_URL=""
                  fi
                fi
              elif echo "$PATH_URL" | grep -q "^/uploads/"; then
                CLEAN_UP_PATH="${PATH_URL%%\?*}"
                SAFE_CACHE_NAME=$(basename "$CLEAN_UP_PATH" | sed 's/[^a-zA-Z0-9._-]/_/g')
                CACHE_FILE="/tmp/media_cache/${SAFE_CACHE_NAME}"
                if [ ! -s "$CACHE_FILE" ] && [ ! -f "${CACHE_FILE}.dl" ]; then
                  touch "${CACHE_FILE}.dl"
                  (curl -sfL "http://84.235.248.136${CLEAN_UP_PATH}" -o "${CACHE_FILE}.tmp" && mv "${CACHE_FILE}.tmp" "$CACHE_FILE"; rm -f "${CACHE_FILE}.dl") &
                fi
              else
                SAFE_CACHE_NAME=$(echo "$VIDEO_NAME" | sed 's/[^a-zA-Z0-9._-]/_/g')
                CACHE_FILE="/tmp/media_cache/${SAFE_CACHE_NAME}"
              fi

              if echo "$PATH_URL" | grep -q "^/uploads/"; then
                REMOTE_URL="http://84.235.248.136${PATH_URL}?_v=$(date +%s)"
              elif [ -n "$HF_URL" ] && [ "$HF_URL" != "null" ] && ! echo "$HF_URL" | grep -q "huggingface.co/buckets/"; then
                if echo "$HF_URL" | grep -q "?"; then
                  REMOTE_URL="${HF_URL}&_v=$(date +%s)"
                else
                  REMOTE_URL="${HF_URL}?_v=$(date +%s)"
                fi
              elif echo "$VIDEO_NAME" | grep -qi "Elite"; then
                REMOTE_URL="http://84.235.248.136/uploads/Elite_Force_2026_S01E01_720p_HD.mp4?_v=$(date +%s)"
              elif [ -n "$PATH_URL" ] && [ "$PATH_URL" != "null" ]; then
                if echo "$PATH_URL" | grep -qiE "^(browser|ndi|webrtc|camera)://"; then
                  VIDEO_NAME=""
                  REMOTE_URL=""
                elif echo "$PATH_URL" | grep -q "^http"; then
                  REMOTE_URL="$PATH_URL"
                elif echo "$PATH_URL" | grep -q "?"; then
                  REMOTE_URL="http://84.235.248.136${PATH_URL}&_v=$(date +%s)"
                else
                  REMOTE_URL="http://84.235.248.136${PATH_URL}?_v=$(date +%s)"
                fi
              else
                REMOTE_URL="http://84.235.248.136/uploads/${SAFE_CACHE_NAME}?_v=$(date +%s)"
              fi

              if [ -s "$CACHE_FILE" ]; then
                REAL_DUR=$(ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1:nokey=1 "$CACHE_FILE" 2>/dev/null | awk '{print int($1)}')
                if [ -z "$REAL_DUR" ] || [ "$REAL_DUR" -lt 5 ]; then
                  rm -f "$CACHE_FILE"
                fi
              fi

              if [ -s "$CACHE_FILE" ]; then
                INPUT_SOURCE="$CACHE_FILE"
                DURATION_VAL="$REAL_DUR"
              else
                INPUT_SOURCE="$REMOTE_URL"
              fi
            fi

            FF_START_TS=$(date +%s)
            SAFE_CUR_CLIP=$(echo "$VIDEO_NAME" | sed 's/[^a-zA-Z0-9._-]/_/g')
            rm -f /tmp/clip_switched_by_watcher

            # Background watcher:
            # 1) Checks if active clip changed (or playlist emptied/populated) BEFORE posting timecode
            # 2) Pre-caches ALL queued playlist items in advance
            # 3) On video switch or playlist clear, gracefully stops clip_feeder (keeping Master RTMP Encoder & Tickers 100% live!)
            (
              while kill -0 $$ 2>/dev/null; do
                sleep 1

                CTRL_NOW=$(curl -s "https://www.onairplayout.com/api/stream/status?uid=${OP_UID}&worker=1" 2>/dev/null || echo '{"active":true}')
                ACT_NOW=$(echo "$CTRL_NOW" | jq -r '.active // true' 2>/dev/null || echo "true")
                if [ "$ACT_NOW" = "false" ]; then
                  touch /tmp/clip_switched_by_watcher
                  if [ -f /tmp/feeder_av.pid ]; then kill -INT $(cat /tmp/feeder_av.pid) 2>/dev/null || true; fi
                  break
                fi

                ST_NOW=$(curl -s "https://www.onairplayout.com/api/program/state?uid=${OP_UID}&worker=1" 2>/dev/null || echo "{}")
                curl -s "https://www.onairplayout.com/api/operator/settings?uid=${OP_UID}" -o /tmp/watcher_op_settings.json 2>/dev/null || echo "{}" > /tmp/watcher_op_settings.json
                MAIN_PL_LEN_NOW=$(jq -r '(.settings.playlist // []) | length' /tmp/watcher_op_settings.json 2>/dev/null | awk '{print int($1)}')
                if [ -z "$MAIN_PL_LEN_NOW" ] || [ "$MAIN_PL_LEN_NOW" -lt 0 ]; then MAIN_PL_LEN_NOW=0; fi
                MAIN_PL_LEN=$MAIN_PL_LEN_NOW
                PL_LEN_NOW=$(jq -r '((.settings.playlist // []) | length) + ((.settings.gapFiller // []) | length)' /tmp/watcher_op_settings.json 2>/dev/null | awk '{print int($1)}')
                if [ -z "$PL_LEN_NOW" ] || [ "$PL_LEN_NOW" -lt 0 ]; then PL_LEN_NOW=0; fi
                NAME_NOW=$(echo "$ST_NOW" | jq -r '.programItem.name // empty' 2>/dev/null || echo "")
                PATH_NOW=$(echo "$ST_NOW" | jq -r '.programItem.path // empty' 2>/dev/null || echo "")
                if [ "$NAME_NOW" = "null" ]; then NAME_NOW=""; fi

                # Case A: Playlist was empty (no video) and operator added a video -> switch from black screen to video!
                if [ -z "$VIDEO_NAME" ] && [ -n "$NAME_NOW" ]; then
                  touch /tmp/clip_switched_by_watcher
                  echo "Playlist populated with $NAME_NOW -> switching from Tickers-Only Black Screen to Video!"
                  if [ -f /tmp/feeder_av.pid ]; then kill -INT $(cat /tmp/feeder_av.pid) 2>/dev/null || true; fi
                  break
                fi

                # Case B: Video was playing and operator emptied the playlist -> stop video and switch to Tickers-Only Black Screen!
                if [ -n "$VIDEO_NAME" ] && [ -z "$NAME_NOW" ]; then
                  touch /tmp/clip_switched_by_watcher
                  echo "Playlist cleared -> stopping video and switching to Tickers-Only Black Screen!"
                  if [ -f /tmp/feeder_av.pid ]; then kill -INT $(cat /tmp/feeder_av.pid) 2>/dev/null || true; fi
                  break
                fi

                # Case C: Video changed to a different video
                if [ -n "$VIDEO_NAME" ] && [ -n "$NAME_NOW" ]; then
                  NEW_YT=$(echo "$ST_NOW" | jq -r '.programItem.ytId // empty' 2>/dev/null || echo "")
                  if [ "$NEW_YT" = "null" ]; then NEW_YT=""; fi
                  if [ -z "$NEW_YT" ]; then
                    if echo "$PATH_NOW" | grep -qiE "youtube|youtu\.be"; then
                      NEW_YT=$(echo "$PATH_NOW" | sed -nE 's/.*(v=|embed\/|youtu\.be\/|shorts\/|live\/)([a-zA-Z0-9_-]{11}).*/\2/p' | head -n 1)
                    elif echo "$PATH_NOW" | grep -q "/uploads/yt_"; then
                      NEW_YT=$(echo "$PATH_NOW" | sed -nE 's/.*\/uploads\/yt_([a-zA-Z0-9_-]{11})\.mp4.*/\1/p' | head -n 1)
                    fi
                  fi
                  SAFE_NOW=$(echo "$NAME_NOW" | sed 's/[^a-zA-Z0-9._-]/_/g')
                  SAFE_CUR=$(echo "$VIDEO_NAME" | sed 's/[^a-zA-Z0-9._-]/_/g')

                  IS_SAME_CLIP="false"
                  NEW_IS_GF=$(echo "$ST_NOW" | jq -r '.programItem.isGapFiller // false' 2>/dev/null || echo "false")
                  if [ "$IS_CUR_GF" = "$NEW_IS_GF" ]; then
                    if [ -n "$YT_ID" ] && [ -n "$NEW_YT" ] && [ "$YT_ID" = "$NEW_YT" ]; then
                      IS_SAME_CLIP="true"
                    elif [ -z "$YT_ID" ] && [ -z "$NEW_YT" ] && [ "$SAFE_NOW" = "$SAFE_CUR" ]; then
                      IS_SAME_CLIP="true"
                    fi
                  fi

                  if [ "$IS_SAME_CLIP" = "false" ]; then
                    touch /tmp/clip_switched_by_watcher
                    if [ -n "$NEW_YT" ] && [ ! -s "/tmp/media_cache/yt_${NEW_YT}.mp4" ]; then
                      if ! curl -sI -f "http://84.235.248.136/uploads/yt_${NEW_YT}.mp4" >/dev/null 2>&1; then
                        curl -s -X POST "https://www.onairplayout.com/api/youtube/prefetch?ytId=${NEW_YT}" >/dev/null 2>&1 || true
                      fi
                    fi
                    echo "Seamlessly switching single A/V Clip Feeder to $NAME_NOW ($PATH_NOW) without dropping RTMP..."
                    if [ -f /tmp/feeder_av.pid ]; then kill -INT $(cat /tmp/feeder_av.pid) 2>/dev/null || true; fi
                    break
                  fi
                fi

                if [ -n "$VIDEO_NAME" ]; then
                  NOW_TS=$(date +%s)
                  ELAPSED=$(( NOW_TS - FF_START_TS ))
                  RAW_TC=$(( TIMECODE + ELAPSED ))
                  if [ "$IS_CUR_GF" = "true" ] && [ "$MAIN_PL_LEN" -eq 0 ] && [ "$PL_LEN" -le 1 ] && [ "$DURATION_VAL" -gt 5 ]; then
                    LIVE_TC=$(( RAW_TC % DURATION_VAL ))
                  else
                    LIVE_TC=$RAW_TC
                  fi
                  TC_RESP=$(curl -s -X POST "https://www.onairplayout.com/api/program/live-timecode?uid=${OP_UID}&from=worker" \
                    -H "Content-Type: application/json" \
                    -d "{\"uid\":\"${OP_UID}\",\"timecode\":$LIVE_TC,\"fromWorker\":true,\"clipName\":\"$SAFE_CUR_CLIP\",\"ytId\":\"$YT_ID\"}" 2>/dev/null || echo "{}")
                  STUDIO_ACTIVE=$(echo "$TC_RESP" | jq -r '.studioMasterActive // false' 2>/dev/null || echo "false")
                  if [ "$STUDIO_ACTIVE" = "true" ] && [ "$ELAPSED" -ge 6 ]; then
                    STUDIO_TC=$(echo "$TC_RESP" | jq -r '.timecode // 0' 2>/dev/null | awk '{print int($1)}')
                    if [ -n "$STUDIO_TC" ] && [ "$STUDIO_TC" -ge 0 ]; then
                      TC_DIFF=$(( STUDIO_TC - LIVE_TC ))
                      if [ "$TC_DIFF" -gt 10 ] || [ "$TC_DIFF" -lt -10 ]; then
                        touch /tmp/clip_switched_by_watcher
                        echo "Studio timecode seek detected ($LIVE_TC -> $STUDIO_TC) -> seamlessly seeking single A/V Clip Feeder without dropping RTMP..."
                        if [ -f /tmp/feeder_av.pid ]; then kill -INT $(cat /tmp/feeder_av.pid) 2>/dev/null || true; fi
                        break
                      fi
                    fi
                  fi
                fi

                if [ "$PL_LEN_NOW" -gt 0 ]; then
                  PL_LEN=$PL_LEN_NOW
                  for Q_PATH in $(jq -r '((.settings.playlist // [])[0:3][].path // empty), ((.settings.gapFiller // [])[].path // empty)' /tmp/watcher_op_settings.json 2>/dev/null); do
                    if echo "$Q_PATH" | grep -q "^/uploads/"; then
                      Q_FNAME=$(basename "${Q_PATH%%\?*}" | sed 's/[^a-zA-Z0-9._-]/_/g')
                      Q_LOCAL="/tmp/media_cache/${Q_FNAME}"
                      RECENT_FAIL=""
                      if [ -f "${Q_LOCAL}.fail" ]; then
                        RECENT_FAIL=$(find "${Q_LOCAL}.fail" -mmin -1 2>/dev/null || echo "")
                      fi
                      if [ ! -s "$Q_LOCAL" ] && [ ! -f "${Q_LOCAL}.Pre" ] && [ -z "$RECENT_FAIL" ]; then
                        touch "${Q_LOCAL}.Pre"
                        (
                          if curl -sfL "http://84.235.248.136${Q_PATH%%\?*}" -o "${Q_LOCAL}.tmp"; then
                            TMP_DUR=$(ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1:nokey=1 "${Q_LOCAL}.tmp" 2>/dev/null | awk '{print int($1)}')
                            if [ -n "$TMP_DUR" ] && [ "$TMP_DUR" -ge 5 ]; then
                              mv "${Q_LOCAL}.tmp" "$Q_LOCAL"
                              rm -f "${Q_LOCAL}.fail"
                            else
                              rm -f "${Q_LOCAL}.tmp"
                              touch "${Q_LOCAL}.fail"
                            fi
                          else
                            rm -f "${Q_LOCAL}.tmp"
                            touch "${Q_LOCAL}.fail"
                          fi
                          rm -f "${Q_LOCAL}.Pre"
                        ) &
                      fi
                    fi
                  done
                fi
              done
            ) &
            WATCHER_PID=$!

            echo "${FEED_W}x${FEED_H}:${ENC_FPS}" > /tmp/feeder_av.spec
            if [ -z "$VIDEO_NAME" ]; then
              echo "Playlist is empty -> Feeding ${FEED_W}x${FEED_H} Black Canvas + Silent Audio while Live Tickers & Overlays remain ON AIR..."
              ffmpeg -nostdin -y -hide_banner -loglevel warning -nostats \
                -re -f lavfi -i "color=c=black:s=${FEED_W}x${FEED_H}:r=$ENC_FPS" \
                -re -f lavfi -i "anullsrc=r=48000:cl=stereo:n=1600" \
                -map 0:v:0 -map 1:a:0 \
                -vf "setpts=N/(${ENC_FPS}*TB)" \
                -af "asetpts=N/SR/TB" \
                -shortest -max_interleave_delta 0 \
                -c:v mpeg2video -q:v 3 -g 1 -r "$ENC_FPS" -pix_fmt yuv420p \
                -c:a mp2 -b:a 256k -ar 48000 -ac 2 \
                -mpegts_flags +resend_headers+pat_pmt_at_frames \
                -muxdelay 0 -muxpreload 0 -flush_packets 1 \
                -pkt_size 1316 -f mpegts /tmp/muxed_av.ts &
              FEED_AV_PID=$!
              echo $FEED_AV_PID > /tmp/feeder_av.pid
              wait $FEED_AV_PID 2>/dev/null || true
            else
              echo "Feeding 100% Frame-Accurate Zero-Drift Lip-Synced Video+Audio Clip: $VIDEO_NAME (Source: $INPUT_SOURCE) @ ${FEED_W}x${FEED_H} ${ENC_FPS}fps starting at ${TIMECODE}s..."
              RECON_FLAGS=""
              SEEK_MODE="-accurate_seek"
              if echo "$INPUT_SOURCE" | grep -qiE "^https?://"; then
                RECON_FLAGS="-reconnect 1 -reconnect_delay_max 5"
              fi
              TRIM_V=""
              TRIM_A=""
              HAS_AUD="1"
              EX_VD="$DURATION_VAL"
              EX_AD="$DURATION_VAL"
              if [ -s "$INPUT_SOURCE" ]; then
                PROBE_JSON=$(ffprobe -v error -show_entries stream=codec_type,duration:format=duration -of json "$INPUT_SOURCE" 2>/dev/null || echo "{}")
                HAS_AUD=$(echo "$PROBE_JSON" | jq -r '[.streams[]? | select(.codec_type=="audio")] | length' 2>/dev/null | awk '{print int($1)}')
                P_VD=$(echo "$PROBE_JSON" | jq -r '([.streams[]? | select(.codec_type=="video") | .duration // empty][0]) // .format.duration // empty' 2>/dev/null)
                P_AD=$(echo "$PROBE_JSON" | jq -r '([.streams[]? | select(.codec_type=="audio") | .duration // empty][0]) // .format.duration // empty' 2>/dev/null)
                if [ -n "$P_VD" ] && [ "$P_VD" != "N/A" ] && [ "$P_VD" != "null" ]; then EX_VD="$P_VD"; fi
                if [ -n "$P_AD" ] && [ "$P_AD" != "N/A" ] && [ "$P_AD" != "null" ]; then EX_AD="$P_AD"; fi
              fi
              if [ -n "$INPUT_SOURCE" ]; then
                PLAY_COUNTS=$(awk -v vd="$EX_VD" -v ad="$EX_AD" -v tc="$TIMECODE" -v fps="$ENC_FPS" 'BEGIN {
                  v = vd + 0; a = ad + 0; t = tc + 0; f = int(fps > 0 ? fps : 30);
                  m = (v > 1 && a > 1) ? (v < a ? v : a) : (v > 1 ? v : a);
                  rem = m - t - 0.15;
                  if (rem > 1.3) {
                    step = 1;
                    while (step < 300 && ((step * 48000) % (f * 1152)) != 0) step++;
                    raw_f = int(rem * f);
                    play_f = int(raw_f / step) * step;
                    if (play_f >= step) {
                      play_s = int((play_f * 48000) / f);
                      printf "%d %d", play_f, play_s;
                    }
                  }
                }')
                if [ -n "$PLAY_COUNTS" ]; then
                  PLAY_FRAMES=$(echo "$PLAY_COUNTS" | awk '{print $1}')
                  PLAY_SAMPLES=$(echo "$PLAY_COUNTS" | awk '{print $2}')
                  if [ -n "$PLAY_FRAMES" ] && [ -n "$PLAY_SAMPLES" ]; then
                    TRIM_V="trim=end_frame=${PLAY_FRAMES},"
                    TRIM_A="apad,atrim=end_sample=${PLAY_SAMPLES},"
                  fi
                fi
              fi
              if [ "$HAS_AUD" = "0" ]; then
                SIL_TRIM=""
                if [ -n "${PLAY_SAMPLES:-}" ]; then SIL_TRIM="atrim=end_sample=${PLAY_SAMPLES},"; fi
                ffmpeg -nostdin -y -hide_banner -loglevel warning -nostats \
                  $RECON_FLAGS \
                  -re -ss "$TIMECODE" $SEEK_MODE -i "$INPUT_SOURCE" \
                  -f lavfi -i "anullsrc=r=48000:cl=stereo:n=1600" \
                  -map 0:v:0 -map 1:a:0 \
                  -vf "fps=${ENC_FPS}:start_time=0,${TRIM_V}scale=${FEED_W}:${FEED_H}:force_original_aspect_ratio=decrease:flags=bicubic,pad=${FEED_W}:${FEED_H}:(ow-iw)/2:(oh-ih)/2,format=yuv420p,setpts=N/(${ENC_FPS}*TB)" \
                  -af "${SIL_TRIM}asetpts=N/SR/TB" \
                  -shortest -max_interleave_delta 0 \
                  -c:v mpeg2video -q:v 2 -g 1 -r "$ENC_FPS" -pix_fmt yuv420p \
                  -c:a mp2 -b:a 256k -ar 48000 -ac 2 \
                  -mpegts_flags +resend_headers+pat_pmt_at_frames \
                  -muxdelay 0 -muxpreload 0 -flush_packets 1 \
                  -pkt_size 1316 -f mpegts /tmp/muxed_av.ts &
              else
                ffmpeg -nostdin -y -hide_banner -loglevel warning -nostats \
                  $RECON_FLAGS \
                  -re -ss "$TIMECODE" $SEEK_MODE -i "$INPUT_SOURCE" \
                  -map 0:v:0 -map 0:a:0 \
                  -vf "fps=${ENC_FPS}:start_time=0,${TRIM_V}scale=${FEED_W}:${FEED_H}:force_original_aspect_ratio=decrease:flags=bicubic,pad=${FEED_W}:${FEED_H}:(ow-iw)/2:(oh-ih)/2,format=yuv420p,setpts=N/(${ENC_FPS}*TB)" \
                  -af "aresample=48000:async=1000:first_pts=0,${TRIM_A}asetpts=N/SR/TB" \
                  -shortest -max_interleave_delta 0 \
                  -c:v mpeg2video -q:v 2 -g 1 -r "$ENC_FPS" -pix_fmt yuv420p \
                  -c:a mp2 -b:a 256k -ar 48000 -ac 2 \
                  -mpegts_flags +resend_headers+pat_pmt_at_frames \
                  -muxdelay 0 -muxpreload 0 -flush_packets 1 \
                  -pkt_size 1316 -f mpegts /tmp/muxed_av.ts &
              fi
              FEED_AV_PID=$!
              echo $FEED_AV_PID > /tmp/feeder_av.pid
              wait $FEED_AV_PID 2>/dev/null || true
            fi

            pkill -P $WATCHER_PID 2>/dev/null || true
            kill $WATCHER_PID 2>/dev/null || true
            FINAL_ELAPSED=$(( $(date +%s) - FF_START_TS ))
            if [ "$FINAL_ELAPSED" -lt 3 ] && [ ! -f /tmp/clip_switched_by_watcher ]; then
              ffmpeg -nostdin -y -hide_banner -loglevel error -nostats \
                -re -f lavfi -i "color=c=black:s=${FEED_W}x${FEED_H}:r=$ENC_FPS" \
                -re -f lavfi -i "anullsrc=r=48000:cl=stereo:n=1600" \
                -t 1.2 -shortest -max_interleave_delta 0 -map 0:v:0 -map 1:a:0 \
                -vf "setpts=N/(${ENC_FPS}*TB)" -af "asetpts=N/SR/TB" \
                -c:v mpeg2video -q:v 3 -g 1 -r "$ENC_FPS" -pix_fmt yuv420p \
                -c:a mp2 -b:a 256k -ar 48000 -ac 2 \
                -mpegts_flags +resend_headers+pat_pmt_at_frames -muxdelay 0 -muxpreload 0 -flush_packets 1 \
                -pkt_size 1316 -f mpegts /tmp/muxed_av.ts 2>/dev/null || sleep 1
            fi
            FINAL_REACHED=$(( TIMECODE + FINAL_ELAPSED ))
            # Only advance/reset timecode if a video clip actually played to its end AND was not already switched by WATCHER_PID!
            if [ -n "$VIDEO_NAME" ] && [ ! -f /tmp/clip_switched_by_watcher ] && [ "$DURATION_VAL" -gt 10 ] && [ "$FINAL_REACHED" -ge $(( DURATION_VAL - 8 )) ]; then
              LAST_FINISHED_CLIP="$SAFE_CUR_CLIP"
              if [ "$IS_CUR_GF" != "true" ] || [ "$MAIN_PL_LEN" -gt 0 ] || [ "$PL_LEN" -gt 1 ]; then
                curl -s -X POST "https://www.onairplayout.com/api/program/live-timecode?uid=${OP_UID}&from=worker" \
                  -H "Content-Type: application/json" \
                  -d "{\"uid\":\"${OP_UID}\",\"timecode\":$DURATION_VAL,\"fromWorker\":true,\"advanceNext\":true,\"clipName\":\"$SAFE_CUR_CLIP\",\"ytId\":\"$YT_ID\"}" >/dev/null 2>&1 || true
              else
                curl -s -X POST "https://www.onairplayout.com/api/program/live-timecode?uid=${OP_UID}&from=worker" \
                  -H "Content-Type: application/json" \
                  -d "{\"uid\":\"${OP_UID}\",\"timecode\":0,\"fromWorker\":true,\"clipName\":\"$SAFE_CUR_CLIP\",\"ytId\":\"$YT_ID\"}" >/dev/null 2>&1 || true
              fi
            fi
          done
          kill $MASTER_ENC_SUP_PID $STAGE_WATCHDOG_PID 2>/dev/null || true
          exec 3>&-
