name: OnAir 24x7 Cloud Broadcast Engine

on:
  workflow_dispatch:
    inputs:
      feed_url:
        description: 'Program Output Feed URL'
        required: false
        default: 'https://24.onairplayout.com/?view=program&uid=op_1790161020557&overlay_only=1'
      rtmp_url:
        description: 'RTMP Destination URL(s) (pipe-separated for multiple)'
        required: false
        default: 'rtmp://rtmp.onairplayout.com:1935/live/live_nadeem'
      duration_sec:
        description: 'Stream duration in seconds (default 20700 = 5h45m)'
        required: false
        default: '20700'

jobs:
  broadcast:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      TZ: Asia/Karachi
    steps:
      - name: Checkout Engine
        uses: actions/checkout@v4

      - name: Configure Timezone, Urdu Fonts & yt-dlp (Instant 2s Setup)
        run: |
          sudo ln -snf /usr/share/zoneinfo/Asia/Karachi /etc/localtime && echo "Asia/Karachi" | sudo tee /etc/timezone
          mkdir -p ~/.local/share/fonts
          curl -sL "https://github.com/google/fonts/raw/main/ofl/amiri/Amiri-Bold.ttf" -o ~/.local/share/fonts/Amiri-Bold.ttf || true
          curl -sL "https://github.com/google/fonts/raw/main/ofl/notonastaliqurdu/NotoNastaliqUrdu%5Bwght%5D.ttf" -o ~/.local/share/fonts/NotoNastaliqUrdu.ttf || true
          fc-cache -f ~/.local/share/fonts || true
          sudo curl -sL https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp -o /usr/local/bin/yt-dlp && sudo chmod a+rx /usr/local/bin/yt-dlp || true

      - name: Launch 24/7 Headless Broadcast Studio (Local NVMe SSD + YouTube Bot-Bypass + Dynamic Encoder Settings)
        env:
          TZ: Asia/Karachi
          FEED_URL: ${{ inputs.feed_url || 'https://24.onairplayout.com/?view=program&uid=op_1790161020557&overlay_only=1' }}
          RTMP_URL: ${{ inputs.rtmp_url || 'rtmp://rtmp.onairplayout.com:1935/live/live_nadeem' }}
          DURATION_SEC: ${{ inputs.duration_sec || '20700' }}
        run: |
          export TZ=Asia/Karachi
          export PATH="$HOME/.local/bin:/usr/local/bin:$PATH"
          if ! echo "$FEED_URL" | grep -q "overlay_only=1"; then
            FEED_URL="${FEED_URL}&overlay_only=1"
          fi

          mkdir -p /tmp/media_cache
          # Pre-cache USP_MULTAN, yt_cAd8cvqRi9g.mp4, and yt_P4zyZAl30To.mp4 to local NVMe SSD
          curl -sL "https://24.onairplayout.com/uploads/USP_MULTAN_15_Anniversary.mp4" -o "/tmp/media_cache/USP_MULTAN_15_Anniversary.mp4" &
          curl -sL "https://24.onairplayout.com/uploads/yt_cAd8cvqRi9g.mp4" -o "/tmp/media_cache/yt_cAd8cvqRi9g.mp4" &
          curl -sL "https://24.onairplayout.com/uploads/yt_P4zyZAl30To.mp4" -o "/tmp/media_cache/yt_P4zyZAl30To.mp4" &
          DEFAULT_HF_VIDEO="https://huggingface.co/buckets/Onairplayout/playout-media/resolve/SSRmovies.COM%20-%20Elite%20Force%202026%20S01E01%20NF%20Dual%20Audio%20Hindi%20(ORG%205.1)%20720p%20WEB-DL%20x264%20Multi%20Subs.mkv"
          (
            curl -sL "$DEFAULT_HF_VIDEO" -o "/tmp/media_cache/elite_force.mkv.tmp" && mv "/tmp/media_cache/elite_force.mkv.tmp" "/tmp/media_cache/Elite_Force_2026_S01E01_720p_HD.mp4"
          ) &

          # 1. Start PulseAudio virtual speaker
          pulseaudio -D --exit-idle-time=-1 || true
          pactl load-module module-null-sink sink_name=virtual_speaker sink_properties=device.description="Virtual_Speaker" || true
          pactl set-default-sink virtual_speaker || true

          # 2. Start Xvfb 1280x720 24-bit Virtual Screen
          Xvfb :99 -screen 0 1280x720x24 -ac +extension GLX +render -noreset &
          export DISPLAY=:99
          sleep 2

          # 3. Launch Google Chrome in Fullscreen App Mode for Live Tickers + Flares + Logo + Clock
          mkdir -p /tmp/chrome-prof
          touch "/tmp/chrome-prof/First Run"
          TZ=Asia/Karachi google-chrome \
            --no-sandbox \
            --no-first-run \
            --no-default-browser-check \
            --disable-search-engine-choice-screen \
            --user-data-dir=/tmp/chrome-prof \
            --disable-gpu \
            --autoplay-policy=no-user-gesture-required \
            --window-size=1280,720 \
            --window-position=0,0 \
            --kiosk \
            --hide-scrollbars \
            --disable-infobars \
            --disable-notifications \
            --app="$FEED_URL" &

          echo "Waiting 5 seconds for Output Feed & Urdu Tickers to render in Pakistan Time (Asia/Karachi)..."
          sleep 5

          END_TIME=$(( $(date +%s) + DURATION_SEC ))

          while [ $(date +%s) -lt $END_TIME ]; do
            REMAINING=$(( END_TIME - $(date +%s) ))
            if [ $REMAINING -le 5 ]; then break; fi

            # Check stream status & operator Encoder Config from 24.onairplayout.com/api/stream/status
            STREAM_CTRL=$(curl -s "https://24.onairplayout.com/api/stream/status" || echo '{"active":true}')
            IS_ACTIVE=$(echo "$STREAM_CTRL" | jq -r '.active // true')
            if [ "$IS_ACTIVE" = "false" ]; then
              sleep 2
              continue
            fi

            ENC_FPS=$(echo "$STREAM_CTRL" | jq -r '.encoderConfig.fps // 30' | awk '{print int($1)}')
            if [ -z "$ENC_FPS" ] || [ "$ENC_FPS" -lt 15 ] || [ "$ENC_FPS" -gt 60 ]; then ENC_FPS=30; fi
            ENC_GOP=$(( ENC_FPS * 2 ))

            ENC_VBITRATE=$(echo "$STREAM_CTRL" | jq -r '.encoderConfig.videoBitrate // 2500' | awk '{print int($1)}')
            if [ -z "$ENC_VBITRATE" ] || [ "$ENC_VBITRATE" -lt 800 ]; then ENC_VBITRATE=2500; fi
            ENC_MAXRATE=$(( ENC_VBITRATE + 300 ))
            ENC_BUFSIZE=$(( ENC_VBITRATE * 2 ))

            ENC_ABITRATE=$(echo "$STREAM_CTRL" | jq -r '.encoderConfig.audioBitrate // 128' | awk '{print int($1)}')
            if [ -z "$ENC_ABITRATE" ] || [ "$ENC_ABITRATE" -lt 64 ]; then ENC_ABITRATE=128; fi

            CFG_RTMP=$(echo "$STREAM_CTRL" | jq -r '.encoderConfig.rtmpUrl // empty')
            ACTIVE_RTMP="${CFG_RTMP:-$RTMP_URL}"

            # Query current program state from 24.onairplayout.com
            STATE_JSON=$(curl -s "https://24.onairplayout.com/api/program/state?uid=op_1790161020557" || echo "{}")
            VIDEO_NAME=$(echo "$STATE_JSON" | jq -r '.programItem.name // "Elite_Force_2026_S01E01_720p_HD.mp4"')
            HF_URL=$(echo "$STATE_JSON" | jq -r '.programItem.hfResolveUrl // empty')
            PATH_URL=$(echo "$STATE_JSON" | jq -r '.programItem.path // empty')
            DURATION_VAL=$(echo "$STATE_JSON" | jq -r '.programItem.duration // 1919' | awk '{print int($1)}')
            if [ -z "$DURATION_VAL" ] || [ "$DURATION_VAL" -le 5 ]; then DURATION_VAL=1919; fi
            TIMECODE=$(echo "$STATE_JSON" | jq -r '.timecode // 0' | awk '{print int($1)}')
            if [ -z "$TIMECODE" ] || [ "$TIMECODE" -lt 0 ]; then
              TIMECODE=0
            fi
            if [ "$DURATION_VAL" -gt 10 ] && [ "$TIMECODE" -ge $(( DURATION_VAL - 4 )) ]; then
              TIMECODE=0
            fi

            # Detect YouTube ID if PATH_URL or HF_URL is a YouTube link or cached yt_<id>.mp4
            YT_ID=""
            if echo "$PATH_URL" | grep -qiE "youtube|youtu\.be"; then
              YT_ID=$(echo "$PATH_URL" | sed -nE 's/.*(v=|embed\/|youtu\.be\/|shorts\/|live\/)([a-zA-Z0-9_-]{11}).*/\2/p' | head -n 1)
            elif echo "$PATH_URL" | grep -q "/uploads/yt_"; then
              YT_ID=$(echo "$PATH_URL" | sed -nE 's/.*\/uploads\/yt_([a-zA-Z0-9_-]{11})\.mp4.*/\1/p' | head -n 1)
            fi

            if [ -n "$YT_ID" ]; then
              CACHE_FILE="/tmp/media_cache/yt_${YT_ID}.mp4"
              if [ ! -s "$CACHE_FILE" ]; then
                # 1. Check if cached on 24.onairplayout.com/uploads/yt_<YT_ID>.mp4
                if curl -sI -f "https://24.onairplayout.com/uploads/yt_${YT_ID}.mp4" >/dev/null 2>&1; then
                  echo "Downloading cached YouTube MP4 from 24.onairplayout.com/uploads/yt_${YT_ID}.mp4..."
                  curl -sL "https://24.onairplayout.com/uploads/yt_${YT_ID}.mp4" -o "${CACHE_FILE}.tmp" && mv "${CACHE_FILE}.tmp" "$CACHE_FILE" || true
                fi
              fi
              if [ ! -s "$CACHE_FILE" ]; then
                # 2. Download via yt-dlp + Cloudflare WARP proxy + node JS challenge solver (--concurrent-fragments 8 for fast download)
                echo "Downloading YouTube video $YT_ID via yt-dlp + Cloudflare WARP..."
                yt-dlp --js-runtimes node --concurrent-fragments 8 --proxy "socks5://127.0.0.1:40000" -f "18/best[height<=720][ext=mp4]/best[height<=720]" -o "${CACHE_FILE}.tmp" "https://www.youtube.com/watch?v=${YT_ID}" || \
                yt-dlp --js-runtimes node --concurrent-fragments 8 -f "18/best[height<=720][ext=mp4]/best[height<=720]" -o "${CACHE_FILE}.tmp" "https://www.youtube.com/watch?v=${YT_ID}" || true
                if [ -s "${CACHE_FILE}.tmp" ]; then
                  mv "${CACHE_FILE}.tmp" "$CACHE_FILE"
                  # Upload to 24.onairplayout.com so future runs & Studio Monitor have instant MP4 access
                  curl -s -X POST "https://24.onairplayout.com/api/upload-media" -H "Content-Type: application/octet-stream" -H "x-file-name: yt_${YT_ID}.mp4" --data-binary "@$CACHE_FILE" >/dev/null 2>&1 &
                fi
              fi
            else
              SAFE_CACHE_NAME=$(echo "$VIDEO_NAME" | sed 's/[^a-zA-Z0-9._-]/_/g')
              CACHE_FILE="/tmp/media_cache/${SAFE_CACHE_NAME}"
            fi

            if [ -n "$HF_URL" ] && [ "$HF_URL" != "null" ]; then
              REMOTE_URL="$HF_URL"
            elif echo "$VIDEO_NAME" | grep -qi "Elite"; then
              REMOTE_URL="$DEFAULT_HF_VIDEO"
            elif [ -n "$PATH_URL" ] && [ "$PATH_URL" != "null" ]; then
              if echo "$PATH_URL" | grep -q "^http"; then
                REMOTE_URL="$PATH_URL"
              else
                REMOTE_URL="https://24.onairplayout.com${PATH_URL}"
              fi
            else
              REMOTE_URL="$DEFAULT_HF_VIDEO"
            fi

            if [ -s "$CACHE_FILE" ] && ! ffprobe -v error "$CACHE_FILE" >/dev/null 2>&1; then
              rm -f "$CACHE_FILE"
            fi

            if [ ! -s "$CACHE_FILE" ] && [ -z "$YT_ID" ]; then
              if ! echo "$VIDEO_NAME" | grep -qi "Elite"; then
                echo "Caching $VIDEO_NAME to local NVMe SSD ($CACHE_FILE)..."
                curl -sL "$REMOTE_URL" -o "${CACHE_FILE}.tmp" || true
                if [ -s "${CACHE_FILE}.tmp" ] && ffprobe -v error "${CACHE_FILE}.tmp" >/dev/null 2>&1; then
                  mv "${CACHE_FILE}.tmp" "$CACHE_FILE"
                else
                  rm -f "${CACHE_FILE}.tmp"
                fi
              fi
            fi

            if [ -s "$CACHE_FILE" ]; then
              INPUT_SOURCE="$CACHE_FILE"
              LOOP_ARGS="-stream_loop -1"
              REAL_DUR=$(ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1:nokey=1 "$CACHE_FILE" 2>/dev/null | awk '{print int($1)}')
              if [ -n "$REAL_DUR" ] && [ "$REAL_DUR" -gt 5 ]; then
                DURATION_VAL="$REAL_DUR"
              fi
            else
              INPUT_SOURCE="$REMOTE_URL"
              LOOP_ARGS=""
            fi

            FF_START_TS=$(date +%s)

            # Background watcher:
            # 1) Pushes exact live FFmpeg playback timecode to /api/program/live-timecode every 2s so /Playout is 100% duration-synced
            # 2) Pre-caches any newly added YouTube video BEFORE switching FFmpeg so /watch/live_nadeem never stalls!
            (
              while kill -0 $$ 2>/dev/null; do
                sleep 2
                NOW_TS=$(date +%s)
                ELAPSED=$(( NOW_TS - FF_START_TS ))
                if [ "$DURATION_VAL" -gt 5 ]; then
                  LIVE_TC=$(( (TIMECODE + ELAPSED) % DURATION_VAL ))
                else
                  LIVE_TC=$(( TIMECODE + ELAPSED ))
                fi
                curl -s -X POST "https://24.onairplayout.com/api/program/live-timecode?uid=op_1790161020557&from=worker" \
                  -H "Content-Type: application/json" \
                  -d "{\"uid\":\"op_1790161020557\",\"timecode\":$LIVE_TC,\"fromWorker\":true}" >/dev/null 2>&1 || true

                CTRL_NOW=$(curl -s "https://24.onairplayout.com/api/stream/status" || echo '{"active":true}')
                ACT_NOW=$(echo "$CTRL_NOW" | jq -r '.active // true')
                if [ "$ACT_NOW" = "false" ]; then
                  pkill -f "ffmpeg -hide_banner" || true
                  break
                fi
                ST_NOW=$(curl -s "https://24.onairplayout.com/api/program/state?uid=op_1790161020557" || echo "{}")
                NAME_NOW=$(echo "$ST_NOW" | jq -r '.programItem.name // empty')
                PATH_NOW=$(echo "$ST_NOW" | jq -r '.programItem.path // empty')
                if [ -n "$NAME_NOW" ] && [ "$NAME_NOW" != "null" ]; then
                  if [ "$NAME_NOW" != "$VIDEO_NAME" ] || ( [ -n "$PATH_NOW" ] && [ "$PATH_NOW" != "null" ] && [ "$PATH_NOW" != "$PATH_URL" ] ); then
                    # If the new item is an uncached YouTube video, pre-download it BEFORE stopping current FFmpeg stream!
                    NEW_YT=""
                    if echo "$PATH_NOW" | grep -qiE "youtube|youtu\.be"; then
                      NEW_YT=$(echo "$PATH_NOW" | sed -nE 's/.*(v=|embed\/|youtu\.be\/|shorts\/|live\/)([a-zA-Z0-9_-]{11}).*/\2/p' | head -n 1)
                    elif echo "$PATH_NOW" | grep -q "/uploads/yt_"; then
                      NEW_YT=$(echo "$PATH_NOW" | sed -nE 's/.*\/uploads\/yt_([a-zA-Z0-9_-]{11})\.mp4.*/\1/p' | head -n 1)
                    fi
                    if [ -n "$NEW_YT" ] && [ ! -s "/tmp/media_cache/yt_${NEW_YT}.mp4" ]; then
                      if curl -sI -f "https://24.onairplayout.com/uploads/yt_${NEW_YT}.mp4" >/dev/null 2>&1; then
                        curl -sL "https://24.onairplayout.com/uploads/yt_${NEW_YT}.mp4" -o "/tmp/media_cache/yt_${NEW_YT}.mp4.tmp" && mv "/tmp/media_cache/yt_${NEW_YT}.mp4.tmp" "/tmp/media_cache/yt_${NEW_YT}.mp4" || true
                      else
                        yt-dlp --js-runtimes node --concurrent-fragments 8 --proxy "socks5://127.0.0.1:40000" -f "18/best[height<=720][ext=mp4]/best[height<=720]" -o "/tmp/media_cache/yt_${NEW_YT}.mp4.tmp" "https://www.youtube.com/watch?v=${NEW_YT}" || true
                        if [ -s "/tmp/media_cache/yt_${NEW_YT}.mp4.tmp" ]; then
                          mv "/tmp/media_cache/yt_${NEW_YT}.mp4.tmp" "/tmp/media_cache/yt_${NEW_YT}.mp4"
                          curl -s -X POST "https://24.onairplayout.com/api/upload-media" -H "Content-Type: application/octet-stream" -H "x-file-name: yt_${NEW_YT}.mp4" --data-binary "@/tmp/media_cache/yt_${NEW_YT}.mp4" >/dev/null 2>&1 &
                        fi
                      fi
                    fi
                    echo "Switching FFmpeg stream to $NAME_NOW ($PATH_NOW)..."
                    pkill -f "ffmpeg -hide_banner" || true
                    break
                  fi
                fi
              done
            ) &
            WATCHER_PID=$!

            echo "Streaming Video: $VIDEO_NAME (Source: $INPUT_SOURCE) @ ${ENC_FPS}fps ${ENC_VBITRATE}kbps starting at ${TIMECODE}s..."
            if echo "$ACTIVE_RTMP" | grep -q "|"; then
              TEE_STR=""
              IFS='|' read -ra ADDR <<< "$ACTIVE_RTMP"
              for u in "${ADDR[@]}"; do
                if [ -n "$TEE_STR" ]; then TEE_STR="${TEE_STR}|"; fi
                TEE_STR="${TEE_STR}[f=flv:onfail=ignore]${u}"
              done
              ffmpeg -hide_banner -loglevel warning -nostats -fflags +genpts \
                $LOOP_ARGS -re -ss "$TIMECODE" -i "$INPUT_SOURCE" \
                -thread_queue_size 1024 -f x11grab -draw_mouse 0 -framerate "$ENC_FPS" -video_size 1280x720 -i :99.0 \
                -t "$REMAINING" \
                -filter_complex "[0:v]scale=1280:720:force_original_aspect_ratio=decrease,pad=1280:720:(ow-iw)/2:(oh-ih)/2,fps=$ENC_FPS,setpts=PTS-STARTPTS,format=yuv420p[vid];[1:v]fps=$ENC_FPS,setpts=PTS-STARTPTS,colorkey=0x000000:0.004:0.0[gfx];[vid][gfx]overlay=0:0:format=auto,format=yuv420p[outv]" \
                -map "[outv]" -map 0:a:0? \
                -af "aresample=async=1:first_pts=0" \
                -c:v libx264 -preset veryfast -tune zerolatency -pix_fmt yuv420p -b:v "${ENC_VBITRATE}k" -maxrate "${ENC_MAXRATE}k" -bufsize "${ENC_BUFSIZE}k" -g "$ENC_GOP" -keyint_min "$ENC_GOP" -sc_threshold 0 \
                -c:a aac -ac 2 -b:a "${ENC_ABITRATE}k" -ar 44100 \
                -flags +global_header -f tee "$TEE_STR" || true
            else
              ffmpeg -hide_banner -loglevel warning -nostats -fflags +genpts \
                $LOOP_ARGS -re -ss "$TIMECODE" -i "$INPUT_SOURCE" \
                -thread_queue_size 1024 -f x11grab -draw_mouse 0 -framerate "$ENC_FPS" -video_size 1280x720 -i :99.0 \
                -t "$REMAINING" \
                -filter_complex "[0:v]scale=1280:720:force_original_aspect_ratio=decrease,pad=1280:720:(ow-iw)/2:(oh-ih)/2,fps=$ENC_FPS,setpts=PTS-STARTPTS,format=yuv420p[vid];[1:v]fps=$ENC_FPS,setpts=PTS-STARTPTS,colorkey=0x000000:0.004:0.0[gfx];[vid][gfx]overlay=0:0:format=auto,format=yuv420p[outv]" \
                -map "[outv]" -map 0:a:0? \
                -af "aresample=async=1:first_pts=0" \
                -c:v libx264 -preset veryfast -tune zerolatency -pix_fmt yuv420p -b:v "${ENC_VBITRATE}k" -maxrate "${ENC_MAXRATE}k" -bufsize "${ENC_BUFSIZE}k" -g "$ENC_GOP" -keyint_min "$ENC_GOP" -sc_threshold 0 \
                -c:a aac -ac 2 -b:a "${ENC_ABITRATE}k" -ar 44100 \
                -f flv "$ACTIVE_RTMP" || true
            fi

            kill $WATCHER_PID 2>/dev/null || true
            sleep 1
          done
