name: OnAir 24x7 Cloud Broadcast Engine

on:
  workflow_dispatch:
    inputs:
      feed_url:
        description: 'Program Output Feed URL'
        required: false
        default: 'https://24.onairplayout.com/?view=program&uid=admin_root'
      rtmp_url:
        description: 'RTMP Destination URL(s) (pipe-separated for multiple)'
        required: false
        default: ''
      duration_sec:
        description: 'Stream duration in seconds (default 20700 = 5h45m)'
        required: false
        default: '20700'

jobs:
  broadcast:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout Engine
        uses: actions/checkout@v4

      - name: Install FFmpeg, Virtual Display & Audio (Xvfb + PulseAudio + Fonts)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg xvfb pulseaudio fonts-noto-core fonts-noto-color-emoji fonts-hosny-amiri

      - name: Launch 24/7 Headless Broadcast Studio (Chrome + FFmpeg Live Stream)
        env:
          FEED_URL: ${{ inputs.feed_url || 'https://24.onairplayout.com/?view=program&uid=admin_root' }}
          RTMP_URL: ${{ inputs.rtmp_url }}
          DURATION_SEC: ${{ inputs.duration_sec || '20700' }}
        run: |
          # 1. Start PulseAudio virtual speaker
          pulseaudio -D --exit-idle-time=-1 || true
          pactl load-module module-null-sink sink_name=virtual_speaker sink_properties=device.description="Virtual_Speaker" || true
          pactl set-default-sink virtual_speaker || true

          # 2. Start Xvfb 1280x720 24-bit Virtual Screen
          Xvfb :99 -screen 0 1280x720x24 -ac +extension GLX +render -noreset &
          export DISPLAY=:99
          sleep 2

          # 3. Launch Google Chrome in Fullscreen App Mode pointing to Live Output Feed
          mkdir -p /tmp/chrome-prof
          touch "/tmp/chrome-prof/First Run"
          google-chrome \
            --no-sandbox \
            --no-first-run \
            --no-default-browser-check \
            --disable-search-engine-choice-screen \
            --user-data-dir=/tmp/chrome-prof \
            --disable-gpu \
            --autoplay-policy=no-user-gesture-required \
            --window-size=1280,720 \
            --window-position=0,0 \
            --kiosk \
            --hide-scrollbars \
            --disable-infobars \
            --disable-notifications \
            --app="$FEED_URL" &

          echo "Waiting 6 seconds for Output Feed & Urdu Tickers to render..."
          sleep 6

          if [ -n "$RTMP_URL" ]; then
            echo "Starting 24/7 Live Stream for $DURATION_SEC seconds..."
            END_TIME=$(( $(date +%s) + DURATION_SEC ))
            while [ $(date +%s) -lt $END_TIME ]; do
              REMAINING=$(( END_TIME - $(date +%s) ))
              if [ $REMAINING -le 5 ]; then break; fi
              if echo "$RTMP_URL" | grep -q "|"; then
                # Multiple RTMP targets via tee muxer
                TEE_STR=""
                IFS='|' read -ra ADDR <<< "$RTMP_URL"
                for u in "${ADDR[@]}"; do
                  if [ -n "$TEE_STR" ]; then TEE_STR="${TEE_STR}|"; fi
                  TEE_STR="${TEE_STR}[f=flv:onfail=ignore]${u}"
                done
                ffmpeg -hide_banner -loglevel warning -nostats \
                  -thread_queue_size 1024 -f x11grab -draw_mouse 0 -framerate 30 -video_size 1280x720 -i :99.0 \
                  -thread_queue_size 1024 -f pulse -i virtual_speaker.monitor \
                  -t "$REMAINING" \
                  -c:v libx264 -preset veryfast -tune zerolatency -pix_fmt yuv420p -b:v 2500k -maxrate 2800k -bufsize 5600k -g 60 -keyint_min 60 -sc_threshold 0 \
                  -c:a aac -b:a 128k -ar 44100 -ac 2 \
                  -flags +global_header -f tee "$TEE_STR" || true
              else
                ffmpeg -hide_banner -loglevel warning -nostats \
                  -thread_queue_size 1024 -f x11grab -draw_mouse 0 -framerate 30 -video_size 1280x720 -i :99.0 \
                  -thread_queue_size 1024 -f pulse -i virtual_speaker.monitor \
                  -t "$REMAINING" \
                  -c:v libx264 -preset veryfast -tune zerolatency -pix_fmt yuv420p -b:v 2500k -maxrate 2800k -bufsize 5600k -g 60 -keyint_min 60 -sc_threshold 0 \
                  -c:a aac -b:a 128k -ar 44100 -ac 2 \
                  -f flv "$RTMP_URL" || true
              fi
              sleep 2
            done
          fi
